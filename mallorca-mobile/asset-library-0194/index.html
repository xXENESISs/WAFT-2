<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141915" />
  <title>WAFT CC0 Library 0.19.4</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="renderCanvas" aria-label="Visor 3D de la biblioteca WAFT"></canvas>
  <header>
    <div class="title-card">
      <span>WAFT CC0 LIBRARY · 0.19.4</span>
      <h1>Mallas y materiales reales</h1>
      <p id="summary">Leyendo el manifiesto…</p>
    </div>
    <button id="resetCamera" type="button">Recentrar</button>
  </header>

  <aside id="assetPanel">
    <div class="filters">
      <input id="searchInput" type="search" placeholder="Buscar asset…" autocomplete="off" />
      <select id="typeFilter" aria-label="Filtrar por tipo">
        <option value="all">Mallas y materiales</option>
        <option value="model">Solo mallas</option>
        <option value="texture">Solo materiales</option>
      </select>
      <select id="categoryFilter" aria-label="Filtrar por categoría">
        <option value="all">Todas las categorías</option>
      </select>
    </div>
    <p id="status">Selecciona un asset para cargarlo.</p>
    <div id="assetList"></div>
  </aside>

  <section id="assetInfo" class="asset-info" hidden>
    <strong id="assetTitle"></strong>
    <span id="assetMeta"></span>
  </section>

  <footer>
    Assets CC0 almacenados localmente ·
    <a href="https://polyhaven.com" rel="noreferrer">Powered by Poly Haven</a>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
