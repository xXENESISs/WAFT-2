<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07161d">
  <title>WAFT Adventure 0.15 Preview</title>
  <style>
    html,body{margin:0;background:#07161d;color:#e7bd63;font:700 18px system-ui;min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  </style>
</head>
<body>
  Cargando WAFT Adventure 0.15…
  <script src="v15s-0.js?v=15"></script>
  <script src="v15s-1.js?v=15"></script>
  <script src="v15s-2.js?v=15"></script>
  <script>
    (async()=>{
      try{
        const packed=window.WAFT15_HTML||'';
        if(!packed) throw Error('El paquete 0.15 está vacío o no se ha descargado.');
        if(typeof DecompressionStream==='undefined') throw Error('Este navegador no admite la descompresión necesaria.');

        const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
        const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
        const decoder=new TextDecoder();
        let html='';

        for(;;){
          const result=await reader.read();
          if(result.done) break;
          html+=decoder.decode(result.value,{stream:true});
        }
        html+=decoder.decode();

        if(!html.trim().startsWith('<!doctype html>')&&!html.includes('<html')){
          throw Error('El paquete 0.15 se descomprimió, pero no contiene una página HTML válida.');
        }

        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.textContent='Error al cargar WAFT 0.15: '+(error&&error.message?error.message:String(error));
      }
    })();
  </script>
</body>
</html>
