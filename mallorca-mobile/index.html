<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WAFT Adventure 0.5 · Mallorca</title>
<style>
*{box-sizing:border-box}html,body,#c{width:100%;height:100%;margin:0;overflow:hidden;background:#071311}#c{display:block;touch-action:none}#hud{position:fixed;z-index:2;top:12px;left:12px;right:12px;color:#fff;font:600 13px system-ui;pointer-events:none;text-shadow:0 2px 5px #000}#hud b{display:block;color:#e4b95f;font-size:16px}#help{position:fixed;z-index:2;bottom:16px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:#071311cc;color:#d9e7df;font:12px system-ui;white-space:nowrap}#load{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#071311;color:#e4b95f;font:700 18px system-ui;text-align:center;padding:24px}.error{color:#ffb4b4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>WAFT ADVENTURE 0.5</b>Mallorca · visor móvil</div>
<div id="help">Arrastra para girar · Pellizca para acercar</div>
<div id="load">Construyendo Mallorca…</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
  const load=document.getElementById('load');
  if(!window.BABYLON){load.innerHTML='<span class="error">No se pudo cargar el motor 3D.<br>Comprueba la conexión y recarga.</span>';return;}
  try{
    const canvas=document.getElementById('c');
    const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true,adaptToDeviceRatio:true});
    const scene=new BABYLON.Scene(engine);
    scene.clearColor=new BABYLON.Color4(0.03,0.08,0.08,1);
    scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity=0.0022;
    scene.fogColor=new BABYLON.Color3(0.42,0.59,0.62);

    const camera=new BABYLON.ArcRotateCamera('cam',-1.15,1.05,250,new BABYLON.Vector3(0,5,0),scene);
    camera.attachControl(canvas,true);
    camera.lowerRadiusLimit=45;
    camera.upperRadiusLimit=430;
    camera.wheelPrecision=18;
    camera.pinchPrecision=45;
    camera.angularSensibilityX=1800;
    camera.angularSensibilityY=1800;

    const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0.2,1,0.1),scene);
    hemi.intensity=.88;
    const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.45,-1,.35),scene);
    sun.position=new BABYLON.Vector3(100,180,-120);
    sun.intensity=1.25;

    const sea=BABYLON.MeshBuilder.CreateGround('sea',{width:620,height:480,subdivisions:1},scene);
    const seaMat=new BABYLON.StandardMaterial('seaMat',scene);
    seaMat.diffuseColor=new BABYLON.Color3(.025,.19,.27);
    seaMat.specularColor=new BABYLON.Color3(.45,.68,.72);
    seaMat.alpha=.98;
    sea.material=seaMat;
    sea.position.y=-1.4;

    function insideMallorca(x,z){
      const nx=x/155, nz=z/95;
      const base=(nx*nx/1.0)+(nz*nz/1.0)<1;
      const westCut=x<-120 && z>35;
      const neCut=x>105 && z<-55;
      const southCut=z>74 && Math.abs(x)>85;
      const northBay=z<-55 && x>10 && x<95;
      const alcudia=z<-63 && x>45 && x<105;
      return base&&!westCut&&!neCut&&!southCut&&!northBay&&!alcudia;
    }
    function gauss(x,z,cx,cz,sx,sz,h){const dx=(x-cx)/sx,dz=(z-cz)/sz;return h*Math.exp(-(dx*dx+dz*dz));}
    function height(x,z){
      if(!insideMallorca(x,z))return -5;
      let h=1.8;
      h+=gauss(x,z,-95,-18,52,20,33);
      h+=gauss(x,z,-62,-28,42,15,23);
      h+=gauss(x,z,-24,-34,38,13,14);
      h+=gauss(x,z,104,15,34,24,13);
      h+=gauss(x,z,72,32,42,26,7);
      h+=gauss(x,z,-6,38,62,38,3);
      h+=Math.sin(x*.11)*Math.cos(z*.09)*.65;
      const coast=Math.max(0,1-((x/155)**2+(z/95)**2));
      h*=Math.min(1,coast*8);
      return Math.max(.15,h);
    }

    const cols=150,rows=96,minX=-160,maxX=160,minZ=-100,maxZ=100;
    const positions=[],indices=[],normals=[],uvs=[],colors=[];
    for(let r=0;r<=rows;r++){
      const z=minZ+(maxZ-minZ)*r/rows;
      for(let c=0;c<=cols;c++){
        const x=minX+(maxX-minX)*c/cols;
        const y=height(x,z);
        positions.push(x,y,z);
        uvs.push(c/cols,r/rows);
        const t=Math.max(0,Math.min(1,y/34));
        if(y<0){colors.push(0,0,0,0)}
        else if(t<.12){colors.push(.52,.58,.31,1)}
        else if(t<.45){colors.push(.23,.40,.18,1)}
        else if(t<.72){colors.push(.34,.31,.22,1)}
        else{colors.push(.62,.61,.56,1)}
      }
    }
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const a=r*(cols+1)+c,b=a+1,d=(r+1)*(cols+1)+c,e=d+1;
      indices.push(a,d,b,b,d,e);
    }
    BABYLON.VertexData.ComputeNormals(positions,indices,normals);
    const vd=new BABYLON.VertexData();
    vd.positions=positions;vd.indices=indices;vd.normals=normals;vd.uvs=uvs;vd.colors=colors;
    const terrain=new BABYLON.Mesh('mallorca',scene);vd.applyToMesh(terrain);
    const mat=new BABYLON.StandardMaterial('terrainMat',scene);
    mat.diffuseColor=new BABYLON.Color3(1,1,1);
    mat.specularColor=new BABYLON.Color3(.08,.08,.08);
    mat.backFaceCulling=false;
    terrain.material=mat;

    const coast=BABYLON.MeshBuilder.CreateTorus('marker',{diameter:12,thickness:.8,tessellation:48},scene);
    coast.rotation.x=Math.PI/2;coast.position=new BABYLON.Vector3(38,height(38,22)+1.3,22);
    const markerMat=new BABYLON.StandardMaterial('markerMat',scene);markerMat.emissiveColor=new BABYLON.Color3(.9,.55,.1);coast.material=markerMat;

    load.style.display='none';
    engine.runRenderLoop(()=>scene.render());
    window.addEventListener('resize',()=>engine.resize());
  }catch(err){console.error(err);load.innerHTML='<span class="error">Error al iniciar el visor.<br>'+String(err.message||err)+'</span>';}
})();
</script>
</body>
</html>
