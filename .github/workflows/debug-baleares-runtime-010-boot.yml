name: Debug Baleares runtime 010 boot

# Debug revision 2.
on:
  push:
    paths:
      - .github/workflows/debug-baleares-runtime-010-boot.yml
      - world-generator/scripts/debug-baleares-runtime-010-browser.mjs
      - world-generator/scripts/patch-baleares-runtime-010-spatial-probe.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Build patch and inspect boot
        shell: bash
        run: |
          set +e
          node world-generator/scripts/build-baleares-runtime-010.mjs > /tmp/runtime-010-debug-build.log 2>&1
          build=$?
          node world-generator/scripts/patch-baleares-runtime-010-spatial-probe.mjs >> /tmp/runtime-010-debug-build.log 2>&1
          patch=$?
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/runtime-010-debug-server.log 2>&1 &
          server_pid=$!
          sleep 2
          node world-generator/scripts/debug-baleares-runtime-010-browser.mjs \
            http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-010.html?v=debug \
            world-generator/baleares-runtime-010-boot-debug.json \
            > world-generator/baleares-runtime-010-boot-debug.log 2>&1
          debug=$?
          kill "$server_pid" >/dev/null 2>&1 || true
          printf '{"build":%s,"patch":%s,"debug":%s}\n' "$build" "$patch" "$debug" > world-generator/baleares-runtime-010-boot-debug-status.json
          cat /tmp/runtime-010-debug-build.log
          cat world-generator/baleares-runtime-010-boot-debug.log
          exit 0
      - name: Commit boot diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mallorca-mobile/region-runtime-baleares-010.html \
            world-generator/baleares-runtime-010-build.json \
            world-generator/baleares-runtime-010-boot-debug.json \
            world-generator/baleares-runtime-010-boot-debug.log \
            world-generator/baleares-runtime-010-boot-debug-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture Baleares runtime 010 boot diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
