name: Diagnose public Baleares preview

on:
  push:
    paths:
      - .github/workflows/diagnose-baleares-preview-public.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Diagnose public deployment
        shell: bash
        run: |
          set +e
          : > world-generator/baleares-preview-public-diagnostic.log
          EXPECTED_BUILD="$(jq -r .buildId regions/baleares/preview/baleares-preview-v1.json)"
          CACHE="$(git rev-parse HEAD)"
          PAGE_URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-preview-baleares-001.html?v=${CACHE}"
          DATA_URL="https://xxenesiss.github.io/WAFT-2/regions/baleares/preview/baleares-preview-v1.json?v=${CACHE}"
          echo "expected_build=${EXPECTED_BUILD}" | tee -a world-generator/baleares-preview-public-diagnostic.log
          echo "page_url=${PAGE_URL}" | tee -a world-generator/baleares-preview-public-diagnostic.log
          echo "data_url=${DATA_URL}" | tee -a world-generator/baleares-preview-public-diagnostic.log
          PAGES_OK=1
          REMOTE_BUILD=""
          for attempt in $(seq 1 72); do
            PAGE_CODE="$(curl -L -sS -o /tmp/preview-page.html -w '%{http_code}' --max-time 20 "$PAGE_URL")"
            DATA_CODE="$(curl -L -sS -o /tmp/preview-data.json -w '%{http_code}' --max-time 20 "$DATA_URL")"
            REMOTE_BUILD="$(jq -r .buildId /tmp/preview-data.json 2>/dev/null)"
            echo "attempt=${attempt} page=${PAGE_CODE} data=${DATA_CODE} remote=${REMOTE_BUILD}" | tee -a world-generator/baleares-preview-public-diagnostic.log
            if [ "$PAGE_CODE" = "200" ] && [ "$DATA_CODE" = "200" ] && [ "$REMOTE_BUILD" = "$EXPECTED_BUILD" ] && grep -q "VISOR REGIONAL 001" /tmp/preview-page.html; then
              PAGES_OK=0
              break
            fi
            sleep 5
          done
          node world-generator/scripts/verify-region-preview-browser.mjs \
            --url "$PAGE_URL" \
            --public \
            --output world-generator/baleares-preview-public-verification.json \
            --screenshot /tmp/baleares-preview-public-diagnostic.png \
            >> world-generator/baleares-preview-public-diagnostic.log 2>&1
          BROWSER_OK=$?
          python3 - "$PAGES_OK" "$BROWSER_OK" "$EXPECTED_BUILD" "$REMOTE_BUILD" "$PAGE_URL" <<'PY'
          import json, sys
          pages, browser = map(int, sys.argv[1:3])
          data = {
              'diagnosticVersion': 1,
              'pages': pages,
              'browser': browser,
              'expectedBuildId': sys.argv[3],
              'remoteBuildId': sys.argv[4],
              'publicUrl': sys.argv[5],
              'valid': pages == 0 and browser == 0,
          }
          with open('world-generator/baleares-preview-public-diagnostic-status.json','w',encoding='utf-8') as handle:
              json.dump(data,handle,indent=2,ensure_ascii=False)
              handle.write('\n')
          PY
          exit 0

      - name: Commit diagnostic results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/baleares-preview-public-diagnostic.log \
            world-generator/baleares-preview-public-diagnostic-status.json
          if [ -f world-generator/baleares-preview-public-verification.json ]; then
            git add world-generator/baleares-preview-public-verification.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record public Baleares preview diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
