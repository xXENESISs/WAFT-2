name: Build WAFT Adventure 0.17.0 Dense Places

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - world-generator/build-waft-0170-v2.js
      - .github/workflows/build-waft-0170-v2.yml

permissions:
  contents: write

concurrency:
  group: build-waft-0170-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and validate dense regional places
        shell: bash
        run: |
          set +e
          : > world-generator/waft-0170-workflow.log
          node --check world-generator/build-waft-0170-v2.js >> world-generator/waft-0170-workflow.log 2>&1
          SYNTAX=$?
          BUILD=99
          VALIDATION=99
          if [ "$SYNTAX" -eq 0 ]; then
            node world-generator/build-waft-0170-v2.js >> world-generator/waft-0170-workflow.log 2>&1
            BUILD=$?
          fi
          if [ "$BUILD" -eq 0 ]; then
            node >> world-generator/waft-0170-workflow.log 2>&1 <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const htmlFiles = [
            'mallorca-mobile/region-runtime-baleares-013.html',
            'mallorca-mobile/region-runtime-catalunya-litoral-003.html',
            'mallorca-mobile/waft-0170.html'
          ];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
            if (!scripts.length) throw new Error(file + ': no contiene JavaScript');
            for (const script of scripts) new Function(script);
          }
          const adventure = fs.readFileSync(htmlFiles[2], 'utf8');
          for (const marker of ['waft-adventure-0170-dense-places-v2','IR A BARCELONA','WAFTDirectTravel0170','region-runtime-baleares-013.html','region-runtime-catalunya-litoral-003.html']) {
            if (!adventure.includes(marker)) throw new Error('Falta marcador de viaje: ' + marker);
          }
          for (const [region, minimumZones, minimumBuildings] of [['baleares',4,850],['catalunya-litoral',3,700]]) {
            const registryPath = `regions/${region}/local-0170/zones-v1.json`;
            const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
            if (registry.zoneCount < minimumZones) throw new Error(`${region}: solo ${registry.zoneCount} zonas`);
            if (registry.totalBuildings < minimumBuildings) throw new Error(`${region}: solo ${registry.totalBuildings} edificios`);
            for (const zone of registry.zones) {
              if (zone.buildingCount < 180) throw new Error(`${zone.name}: zona demasiado vacía (${zone.buildingCount})`);
              const binaryPath = `regions/${region}/local-0170/${zone.binaryFile}`;
              const metadataPath = `regions/${region}/local-0170/${zone.metadataFile}`;
              if (!fs.existsSync(binaryPath) || !fs.existsSync(metadataPath)) throw new Error(`${zone.name}: paquete incompleto`);
              const binary = fs.readFileSync(binaryPath);
              if (binary.subarray(0,8).toString('utf8') !== 'WAFTLZ01') throw new Error(`${zone.name}: binario inválido`);
              if (binary.readUInt32LE(16) !== zone.buildingCount) throw new Error(`${zone.name}: recuento binario incorrecto`);
            }
          }
          const catalunya = JSON.parse(fs.readFileSync('regions/catalunya-litoral/local-0170/zones-v1.json','utf8'));
          if (!catalunya.zones.some(zone => /barcelona/i.test(zone.name))) throw new Error('No se generó una zona local de Barcelona');
          const status = JSON.parse(fs.readFileSync('world-generator/waft-0170-build-status.json','utf8'));
          status.validation = {syntax:0,html:0,packages:0,density:0,barcelona:0,protectedSources:0,validatedAt:new Date().toISOString()};
          const protectedFiles = {
            'mallorca-mobile/waft-0160.html':'b0513dd14b4860739ce57030397d9c7a0966af6e2e4fdbbcad9656421322a2b7'
          };
          for (const [file, expectedSha256] of Object.entries(protectedFiles)) {
            const actual = execFileSync('sha256sum',[file],{encoding:'utf8'}).trim().split(/\s+/)[0];
            if (actual !== expectedSha256) throw new Error(`${file}: versión estable modificada`);
          }
          fs.writeFileSync('world-generator/waft-0170-build-status.json',JSON.stringify(status,null,2)+'\n');
          console.log(JSON.stringify({valid:true,status},null,2));
          NODE
            VALIDATION=$?
          fi
          node - "$SYNTAX" "$BUILD" "$VALIDATION" <<'NODE'
          const fs = require('fs');
          const syntax = Number(process.argv[2]);
          const build = Number(process.argv[3]);
          const validation = Number(process.argv[4]);
          fs.writeFileSync('world-generator/waft-0170-workflow-status.json', JSON.stringify({syntax,build,validation,success:syntax===0&&build===0&&validation===0,recordedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/waft-0170-workflow.log world-generator/waft-0170-workflow-status.json
          for file in world-generator/waft-0170-build-status.json mallorca-mobile/region-runtime-baleares-013.html mallorca-mobile/region-runtime-catalunya-litoral-003.html mallorca-mobile/waft-0170.html; do
            [ -f "$file" ] && git add "$file"
          done
          [ -d regions/baleares/local-0170 ] && git add regions/baleares/local-0170
          [ -d regions/catalunya-litoral/local-0170 ] && git add regions/catalunya-litoral/local-0170
          if ! git diff --cached --quiet; then
            git commit -m "Generate WAFT Adventure 0.17.0 dense places"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          [ "$SYNTAX" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$VALIDATION" -eq 0 ]
