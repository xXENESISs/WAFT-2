name: Verify WAFT 0.15.8 Pages R2

on:
  push:
    paths:
      - .github/workflows/verify-waft-0158-pages-r2.yml
      - mallorca-mobile/verify-waft-0158.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-waft-0158-pages-r2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for exact Pages build
        id: pages
        shell: bash
        run: |
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/waft-0158.html?v=${GITHUB_SHA}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          : > mallorca-mobile/waft-0158-pages-verification.log
          ok=0
          for attempt in $(seq 1 72); do
            code=$(curl -sS -L --max-time 25 -o /tmp/waft-0158-pages.html -w '%{http_code}' "$url" || true)
            printf 'attempt=%s http=%s bytes=%s\n' "$attempt" "${code:-000}" "$(wc -c </tmp/waft-0158-pages.html 2>/dev/null || echo 0)" | tee -a mallorca-mobile/waft-0158-pages-verification.log
            if [ "$code" = "200" ] && cmp -s /tmp/waft-0158-pages.html mallorca-mobile/waft-0158.html; then ok=1; break; fi
            sleep 5
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Validate JavaScript and browser startup
        id: browser
        env:
          WAFT_URL: ${{ steps.pages.outputs.url }}
          PAGES_OK: ${{ steps.pages.outputs.ok }}
        shell: bash
        run: |
          set +e
          ok=0
          if [ "$PAGES_OK" = "1" ]; then
            python - <<'PY'
          import re
          html=open('mallorca-mobile/waft-0158.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          open('/tmp/waft-0158-main.js','w',encoding='utf-8').write(scripts[-1])
          PY
            node --check /tmp/waft-0158-main.js >> mallorca-mobile/waft-0158-pages-verification.log 2>&1
            npm install playwright-core@latest --prefix /tmp/waft-browser-check >> mallorca-mobile/waft-0158-pages-verification.log 2>&1
            chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
            CHROME_PATH="$chrome" NODE_PATH=/tmp/waft-browser-check/node_modules GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" WAFT_URL="$WAFT_URL" node mallorca-mobile/verify-waft-0158.cjs >> mallorca-mobile/waft-0158-pages-verification.log 2>&1
            [ "$?" = "0" ] && ok=1
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          set -e

      - name: Record verification
        env:
          WAFT_URL: ${{ steps.pages.outputs.url }}
          PAGES_OK: ${{ steps.pages.outputs.ok }}
          BROWSER_OK: ${{ steps.browser.outputs.ok }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          data={'version':'0.15.8','trigger_commit':os.environ['GITHUB_SHA'],'pages_url':os.environ['WAFT_URL'],'pages_ok':os.environ['PAGES_OK']=='1','browser_ok':os.environ['BROWSER_OK']=='1'}
          open('mallorca-mobile/waft-0158-verification-status.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mallorca-mobile/waft-0158-pages-verification.log mallorca-mobile/waft-0158-verification-status.json
          [ -f mallorca-mobile/waft-0158-verified.json ] && git add mallorca-mobile/waft-0158-verified.json
          git commit -m "Record corrected WAFT Adventure 0.15.8 verification"
          git push origin HEAD:main

      - name: Require success
        if: steps.pages.outputs.ok != '1' || steps.browser.outputs.ok != '1'
        run: exit 1
