name: Verify public Baleares runtime 005

# Public verification revision 2.
on:
  push:
    paths:
      - .github/workflows/verify-public-baleares-runtime-005.yml
      - world-generator/scripts/run-verify-baleares-runtime-005-browser.mjs
      - mallorca-mobile/region-runtime-baleares-005.html
      - regions/baleares/local/llevant/llevant-local-v1.bin
      - regions/baleares/local/llevant/llevant-local-v1.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Wait for exact public files
        shell: bash
        run: |
          sha="$(git rev-parse HEAD)"
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-005.html?v=${sha}"
          metadata="https://xxenesiss.github.io/WAFT-2/regions/baleares/local/llevant/llevant-local-v1.json?v=${sha}"
          expected="$(jq -r .buildId regions/baleares/local/llevant/llevant-local-v1.json)"
          echo "PUBLIC_URL=${url}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            remote="$(curl -fsS --max-time 20 "$metadata" | jq -r .buildId 2>/dev/null || true)"
            if [ "$remote" = "$expected" ] && curl -fsS --max-time 20 "$url" | grep -q "RUNTIME REGIONAL 005"; then
              echo "Public runtime and local package are current"
              exit 0
            fi
            echo "Waiting (${attempt}/60): remote=${remote:-missing} expected=${expected}"
            sleep 5
          done
          exit 1
      - name: Verify public mobile runtime
        shell: bash
        run: |
          set +e
          node world-generator/scripts/run-verify-baleares-runtime-005-browser.mjs \
            --url "$PUBLIC_URL" \
            --public \
            --output world-generator/baleares-runtime-005-public-verification.json \
            --screenshot /tmp/runtime005-public.png \
            > world-generator/baleares-runtime-005-public-diagnostic.log 2>&1
          code=$?
          printf '{"exitCode":%s,"url":"%s"}\n' "$code" "$PUBLIC_URL" > world-generator/baleares-runtime-005-public-status.json
          cat world-generator/baleares-runtime-005-public-diagnostic.log
          exit 0
      - name: Commit public verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/baleares-runtime-005-public-diagnostic.log world-generator/baleares-runtime-005-public-status.json
          [ -f world-generator/baleares-runtime-005-public-verification.json ] && git add world-generator/baleares-runtime-005-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify public Baleares regional runtime 005"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require public success
        run: |
          test "$(jq -r .exitCode world-generator/baleares-runtime-005-public-status.json)" = "0"
