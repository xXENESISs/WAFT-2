name: Analyze WAFT local-zone density

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - world-generator/scripts/analyze-local-zone-candidates.mjs
      - .github/workflows/analyze-local-zone-density.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Measure candidate density
        run: |
          node --check world-generator/scripts/analyze-local-zone-candidates.mjs
          node world-generator/scripts/analyze-local-zone-candidates.mjs > world-generator/local-zone-candidate-density.log
      - name: Commit density report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/local-zone-candidate-density.json world-generator/local-zone-candidate-density.log
          if ! git diff --cached --quiet; then
            git commit -m "Measure WAFT local-zone candidate density"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
