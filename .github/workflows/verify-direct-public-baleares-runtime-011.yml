name: Verify direct public Baleares runtime 011

# Direct verification revision 3.
on:
  push:
    paths:
      - .github/workflows/verify-direct-public-baleares-runtime-011.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baleares-runtime-011-direct-public
  cancel-in-progress: true

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Resolve exact public URL
        shell: bash
        run: |
          blob="$(git hash-object mallorca-mobile/region-runtime-baleares-011.html)"
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-011.html?v=${blob}"
          echo "RUNTIME_BLOB=${blob}" >> "$GITHUB_ENV"
          echo "PUBLIC_RUNTIME_URL=${url}" >> "$GITHUB_ENV"

      - name: Check exact GitHub Pages build
        id: pages
        shell: bash
        run: |
          set +e
          available=1
          attempts=0
          http=0
          bytes=0
          for attempt in $(seq 1 36); do
            attempts="$attempt"
            tmp="$(mktemp)"
            http="$(curl -L -sS -o "$tmp" -w '%{http_code}' --max-time 20 "$PUBLIC_RUNTIME_URL" || echo 000)"
            bytes="$(wc -c < "$tmp" | tr -d ' ')"
            if [ "$http" = 200 ] && grep -q 'RUNTIME REGIONAL 011' "$tmp" && grep -q 'getTravelState' "$tmp"; then
              available=0
              rm -f "$tmp"
              break
            fi
            rm -f "$tmp"
            sleep 5
          done
          printf '{"available":%s,"httpStatus":"%s","bytes":%s,"attempts":%s,"url":"%s","blob":"%s"}\n' \
            "$([ "$available" = 0 ] && echo true || echo false)" "$http" "$bytes" "$attempts" "$PUBLIC_RUNTIME_URL" "$RUNTIME_BLOB" \
            > world-generator/baleares-runtime-011-pages-status.json
          cat world-generator/baleares-runtime-011-pages-status.json
          echo "code=${available}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run public mobile verification
        id: verify
        if: steps.pages.outputs.code == '0'
        shell: bash
        run: |
          set +e
          node world-generator/scripts/verify-baleares-runtime-011-browser.mjs \
            --url "$PUBLIC_RUNTIME_URL" \
            --public \
            --output world-generator/baleares-runtime-011-public-verification.json \
            --screenshot /tmp/runtime-011-direct-public.png \
            > world-generator/baleares-runtime-011-direct-public.log 2>&1
          code=$?
          printf '{"exitCode":%s,"url":"%s","blob":"%s"}\n' "$code" "$PUBLIC_RUNTIME_URL" "$RUNTIME_BLOB" \
            > world-generator/baleares-runtime-011-direct-public-status.json
          cat world-generator/baleares-runtime-011-direct-public.log
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record skipped verification
        if: steps.pages.outputs.code != '0'
        shell: bash
        run: |
          printf '{"exitCode":99,"url":"%s","blob":"%s","reason":"pages-unavailable"}\n' "$PUBLIC_RUNTIME_URL" "$RUNTIME_BLOB" \
            > world-generator/baleares-runtime-011-direct-public-status.json

      - name: Commit public result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          optional=(
            world-generator/baleares-runtime-011-public-verification.json
            world-generator/baleares-runtime-011-pages-status.json
            world-generator/baleares-runtime-011-direct-public.log
            world-generator/baleares-runtime-011-direct-public-status.json
          )
          for path in "${optional[@]}"; do [ -f "$path" ] && git add "$path"; done
          if ! git diff --cached --quiet; then
            git commit -m "Record direct public Baleares runtime 011 verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require public success
        if: steps.pages.outputs.code != '0' || steps.verify.outputs.code != '0'
        run: exit 1

      - name: Upload public screenshot
        if: steps.verify.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: baleares-runtime-011-direct-public
          path: /tmp/runtime-011-direct-public.png
          retention-days: 7
