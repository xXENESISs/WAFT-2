name: Verify patched Baleares runtime 010

# Verification revision 2.
on:
  push:
    paths:
      - .github/workflows/verify-patched-baleares-runtime-010.yml
      - world-generator/scripts/patch-baleares-runtime-010-spatial-probe.mjs
      - world-generator/scripts/verify-baleares-runtime-010-browser.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Patch and verify locally
        shell: bash
        run: |
          set +e
          node world-generator/scripts/build-baleares-runtime-010.mjs > world-generator/baleares-runtime-010-spatial-verification.log 2>&1
          build=$?
          node world-generator/scripts/patch-baleares-runtime-010-spatial-probe.mjs >> world-generator/baleares-runtime-010-spatial-verification.log 2>&1
          patch=$?
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/runtime-010-spatial-server.log 2>&1 &
          server_pid=$!
          sleep 2
          node world-generator/scripts/verify-baleares-runtime-010-browser.mjs \
            --url http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-010.html?v=spatial \
            --output world-generator/baleares-runtime-010-local-verification.json \
            --screenshot /tmp/runtime-010-spatial.png \
            >> world-generator/baleares-runtime-010-spatial-verification.log 2>&1
          browser=$?
          kill "$server_pid" >/dev/null 2>&1 || true
          printf '{"build":%s,"patch":%s,"browser":%s}\n' "$build" "$patch" "$browser" > world-generator/baleares-runtime-010-spatial-verification-status.json
          cat world-generator/baleares-runtime-010-spatial-verification.log
          exit 0
      - name: Commit verification result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mallorca-mobile/region-runtime-baleares-010.html \
            world-generator/baleares-runtime-010-build.json \
            world-generator/baleares-runtime-010-spatial-verification.log \
            world-generator/baleares-runtime-010-spatial-verification-status.json
          [ -f world-generator/baleares-runtime-010-local-verification.json ] && git add world-generator/baleares-runtime-010-local-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify spatially indexed Baleares runtime 010"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require success
        run: |
          test "$(jq -r .build world-generator/baleares-runtime-010-spatial-verification-status.json)" = 0
          test "$(jq -r .patch world-generator/baleares-runtime-010-spatial-verification-status.json)" = 0
          test "$(jq -r .browser world-generator/baleares-runtime-010-spatial-verification-status.json)" = 0
