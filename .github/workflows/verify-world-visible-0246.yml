name: Verify WAFT world continuity 0.25.0

on:
  push:
    branches:
      - fix/world-0246-visible-reality
      - fix/ci-world-0246
      - fix/world-0247-continuity-labels-canarias
      - fix/world-0248-hotfix-render-cities
      - feat/world-0249-ui-labels-scale-foundation
      - feat/world-0250-real-scale-africa-ground-labels
      - main
    paths:
      - .github/workflows/verify-world-visible-0246.yml
      - world-generator/configs/iberia.region.json
      - world-generator/configs/france.region.json
      - world-generator/configs/canarias.region.json
      - world-generator/configs/northwest-africa.region.json
      - world-generator/scripts/prepare-world-0250.mjs
      - world-generator/scripts/build-region-preview-v2.mjs
      - mallorca-mobile/adventure-0210/index.html
      - mallorca-mobile/adventure-0210/iberia-world-0245.js
      - mallorca-mobile/adventure-0210/iberia-world-0247.js
      - mallorca-mobile/adventure-0210/iberia-world-0249.js
      - mallorca-mobile/adventure-0210/iberia-world-0250.js
      - mallorca-mobile/adventure-0210/verify-0250.mjs
      - mallorca-mobile/adventure-0210/tools/verify-world-0250.mjs
      - regions/iberia/**
      - regions/france/**
      - regions/canarias/**
      - regions/northwest-africa/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waft-world-visible-0250-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visible:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Syntax and 0.25.0 contracts
        run: |
          node --check world-generator/scripts/prepare-world-0250.mjs
          node --check world-generator/scripts/build-region-preview-v2.mjs
          node --check mallorca-mobile/adventure-0210/iberia-world-0245.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0247.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0249.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0250.js
          node --check mallorca-mobile/adventure-0210/verify-0250.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-world-0250.mjs
          node mallorca-mobile/adventure-0210/verify-0250.mjs
      - name: Verify scale, France, labels, Africa, Atlantic and Canarias in Chromium
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-0250-visible-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p /tmp/waft-0250-visible
          node mallorca-mobile/adventure-0210/tools/verify-world-0250.mjs \
            "http://127.0.0.1:8000/mallorca-mobile/adventure-0210/index.html?region=iberia&v=ci-${GITHUB_SHA}" \
            /tmp/waft-0250-visible
      - name: Upload 0.25.0 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waft-0250-world-visible-browser
          path: /tmp/waft-0250-visible/*.png
          retention-days: 7
          if-no-files-found: ignore
