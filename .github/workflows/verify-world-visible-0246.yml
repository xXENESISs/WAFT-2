name: Verify WAFT world visible reality 0.24.6

on:
  push:
    branches:
      - fix/world-0246-visible-reality
    paths:
      - .github/workflows/verify-world-visible-0246.yml
      - world-generator/scripts/prepare-world-0246.mjs
      - world-generator/scripts/ensure-iberia-settlements-0246.mjs
      - world-generator/scripts/build-settlement-markers-0244.py
      - world-generator/scripts/build-region-preview-v2.mjs
      - mallorca-mobile/adventure-0210/index.html
      - mallorca-mobile/adventure-0210/iberia-world-0245.js
      - mallorca-mobile/adventure-0210/iberia-world-0246.js
      - mallorca-mobile/adventure-0210/tools/verify-visible-reality-0246.mjs
      - regions/iberia/**
      - regions/france/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waft-world-visible-0246-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visible:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache GeoNames
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/geonames
          key: waft-geonames-cities15000-2026-08-09-v2
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Syntax and contracts
        run: |
          python -m py_compile world-generator/scripts/build-settlement-markers-0244.py
          node --check world-generator/scripts/prepare-world-0246.mjs
          node --check world-generator/scripts/ensure-iberia-settlements-0246.mjs
          node --check mallorca-mobile/adventure-0210/iberia-world-0245.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0246.js
          node --check mallorca-mobile/adventure-0210/tools/verify-visible-reality-0246.mjs
          node world-generator/scripts/validate-region.mjs
      - name: Prepare Adventure 0.24.6
        run: node world-generator/scripts/prepare-world-0246.mjs
      - name: Rebuild Iberia settlements and preview
        run: |
          python world-generator/scripts/build-settlement-markers-0244.py iberia --countries ES,GI --minimum-population 20000 --exclude-balearics
          node world-generator/scripts/ensure-iberia-settlements-0246.mjs
          node world-generator/scripts/build-region-preview-v2.mjs iberia
      - name: Verify visible contracts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('mallorca-mobile/adventure-0210/index.html','utf8');
          const france=fs.readFileSync('mallorca-mobile/adventure-0210/iberia-world-0245.js','utf8');
          const settlements=JSON.parse(fs.readFileSync('regions/iberia/settlements.json','utf8')).items;
          const objects=JSON.parse(fs.readFileSync('regions/iberia/objects.json','utf8')).items;
          if(!index.includes("__WAFT_ADVENTURE_BUILD__='0.24.6'"))throw new Error('0.24.6 build marker missing');
          if(!index.includes('iberia-world-0246.js'))throw new Error('0.24.6 runtime layer missing');
          if(!index.includes("'flightDive'in modifiers"))throw new Error('Explicit dive API missing');
          const sant=settlements.find(x=>x.name==='Sant Just Desvern');
          if(!sant||sant.population<20000)throw new Error('Sant Just Desvern missing');
          for(const name of ['Ayódar','Peñíscola','Gibraltar']){
            const place=settlements.find(x=>x.name===name);if(!place?.specialMarker)throw new Error(`${name} special missing`);
            if(objects.some(x=>String(x.id||'').includes(String(place.sourceId))))throw new Error(`${name} still generic needle`);
          }
          if(!france.includes('const LOD_MIN_LAT=42.10;')||!france.includes("lift:stride===1?0:-.08"))throw new Error('France overlap repair missing');
          console.log(JSON.stringify({settlements:settlements.length,objects:objects.length,santJust:sant.population,specialGenericObjects:0},null,2));
          NODE
      - name: Persist deterministic generated state
        id: persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mallorca-mobile/adventure-0210/index.html mallorca-mobile/adventure-0210/iberia-world-0245.js regions/iberia
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "WAFT 0.24.6 generated state is deterministic and current."
            exit 0
          fi
          git commit -m "Build WAFT visible reality package 0.24.6"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify visible fixes in Chromium
        if: steps.persist.outputs.changed != 'true'
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-0246-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node mallorca-mobile/adventure-0210/tools/verify-visible-reality-0246.mjs \
            "http://127.0.0.1:8000/mallorca-mobile/adventure-0210/index.html?region=iberia&v=ci-${GITHUB_SHA}" \
            /tmp/waft-visible-0246.png
      - name: Upload visible-fix screenshots
        if: always() && steps.persist.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waft-visible-0246-browser
          path: /tmp/waft-visible-0246*.png
          retention-days: 7
          if-no-files-found: ignore
