name: Build Baleares region preview

on:
  push:
    paths:
      - .github/workflows/build-baleares-region-preview.yml
      - world-generator/scripts/build-region-preview.mjs
      - world-generator/scripts/verify-region-preview.mjs
      - world-generator/scripts/verify-region-preview-browser.mjs
      - world-generator/scripts/verify-region-runtime-002-browser.mjs
      - mallorca-mobile/region-preview-baleares-001.html
      - mallorca-mobile/region-runtime-baleares-002.html
      - regions/baleares/manifest.json
      - regions/baleares/terrain.bin
      - regions/baleares/landcover.bin
      - regions/baleares/objects.json
      - regions/baleares/routes.json
      - regions/baleares/landmarks.json
      - regions/baleares/settlements.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baleares-region-preview-001
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record frozen 0.15.5 files
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-preview-before.sha256

      - name: Check preview and runtime verifier syntax
        shell: bash
        run: |
          node --check world-generator/scripts/build-region-preview.mjs
          node --check world-generator/scripts/verify-region-preview.mjs
          node --check world-generator/scripts/verify-region-preview-browser.mjs
          node --check world-generator/scripts/verify-region-runtime-002-browser.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          for source, target in [
              ('mallorca-mobile/region-preview-baleares-001.html', '/tmp/region-preview-inline.mjs'),
              ('mallorca-mobile/region-runtime-baleares-002.html', '/tmp/region-runtime-002-inline.mjs')
          ]:
              html = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
              if len(scripts) != 1:
                  raise SystemExit(f'Expected one inline script in {source}, found {len(scripts)}')
              Path(target).write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/region-preview-inline.mjs
          node --check /tmp/region-runtime-002-inline.mjs

      - name: Build and validate compact preview package
        shell: bash
        run: |
          node world-generator/scripts/build-region-preview.mjs baleares | tee world-generator/baleares-preview-build.log
          node world-generator/scripts/verify-region-preview.mjs baleares
          rm -rf /tmp/baleares-preview-first
          mkdir -p /tmp/baleares-preview-first
          cp regions/baleares/preview/baleares-preview-v1.bin /tmp/baleares-preview-first/
          cp regions/baleares/preview/baleares-preview-v1.json /tmp/baleares-preview-first/
          node world-generator/scripts/build-region-preview.mjs baleares >/tmp/baleares-preview-rebuild.log
          diff -q /tmp/baleares-preview-first/baleares-preview-v1.bin regions/baleares/preview/baleares-preview-v1.bin
          diff -q /tmp/baleares-preview-first/baleares-preview-v1.json regions/baleares/preview/baleares-preview-v1.json

      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Verify preview and runtime 002 locally
        id: runtime002_local
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/baleares-preview-server.log 2>&1 &
          echo $! >/tmp/baleares-preview-server.pid
          sleep 2
          node world-generator/scripts/verify-region-preview-browser.mjs \
            --url "http://127.0.0.1:8000/mallorca-mobile/region-preview-baleares-001.html?v=local" \
            --output world-generator/baleares-preview-local-browser.json \
            --screenshot /tmp/baleares-preview-local.png
          set +e
          node world-generator/scripts/verify-region-runtime-002-browser.mjs \
            --url "http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-002.html?v=local" \
            --output world-generator/baleares-runtime-002-local-browser.json \
            --screenshot /tmp/baleares-runtime-002-local.png \
            >world-generator/baleares-runtime-002-local-browser.log 2>&1
          code=$?
          set -e
          kill "$(cat /tmp/baleares-preview-server.pid)" || true
          cat > world-generator/baleares-runtime-002-local-browser-status.json <<JSON
          {
            "verificationVersion": 1,
            "scope": "local",
            "exitCode": $code,
            "valid": $([ "$code" -eq 0 ] && echo true || echo false)
          }
          JSON
          cat world-generator/baleares-runtime-002-local-browser-status.json
          cat world-generator/baleares-runtime-002-local-browser.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Confirm frozen build is untouched
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-preview-after.sha256
          diff -u /tmp/waft-0155-preview-before.sha256 /tmp/waft-0155-preview-after.sha256

      - name: Commit preview package and local runtime verification
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            regions/baleares/preview/baleares-preview-v1.bin \
            regions/baleares/preview/baleares-preview-v1.json \
            mallorca-mobile/region-runtime-baleares-001.html \
            world-generator/baleares-preview-build.json \
            world-generator/baleares-preview-validation.json \
            world-generator/baleares-preview-build.log \
            world-generator/baleares-preview-local-browser.json \
            world-generator/baleares-runtime-002-local-browser-status.json \
            world-generator/baleares-runtime-002-local-browser.log
          git add world-generator/baleares-runtime-002-local-browser.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Verify local Baleares regional runtime 002"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          PREVIEW_COMMIT="$(git rev-parse HEAD)"
          echo "commit=${PREVIEW_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_COMMIT=${PREVIEW_COMMIT}" >> "$GITHUB_ENV"
          echo "PREVIEW_BUILD_ID=$(jq -r .buildId regions/baleares/preview/baleares-preview-v1.json)" >> "$GITHUB_ENV"

      - name: Require valid local runtime 002
        if: steps.runtime002_local.outputs.code != '0'
        run: exit 1

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          PAGE_URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-preview-baleares-001.html?v=${PREVIEW_COMMIT}"
          RUNTIME_002_URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-002.html?v=${PREVIEW_COMMIT}"
          DATA_URL="https://xxenesiss.github.io/WAFT-2/regions/baleares/preview/baleares-preview-v1.json?v=${PREVIEW_COMMIT}"
          echo "PAGE_URL=${PAGE_URL}" >> "$GITHUB_ENV"
          echo "RUNTIME_002_URL=${RUNTIME_002_URL}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            REMOTE_BUILD="$(curl -fsS --max-time 20 "$DATA_URL" | jq -r .buildId 2>/dev/null || true)"
            if [ "$REMOTE_BUILD" = "$PREVIEW_BUILD_ID" ] \
              && curl -fsS --max-time 20 "$PAGE_URL" | grep -q "VISOR REGIONAL 001" \
              && curl -fsS --max-time 20 "$RUNTIME_002_URL" | grep -q "RUNTIME REGIONAL 002"; then
              echo "GitHub Pages serves preview and runtime 002 ${PREVIEW_BUILD_ID}"
              exit 0
            fi
            echo "Waiting for Pages (${attempt}/60): remote=${REMOTE_BUILD:-missing} expected=${PREVIEW_BUILD_ID}"
            sleep 5
          done
          echo "GitHub Pages did not publish preview and runtime 002 in time" >&2
          exit 1

      - name: Verify public mobile preview
        shell: bash
        run: |
          node world-generator/scripts/verify-region-preview-browser.mjs \
            --url "$PAGE_URL" \
            --public \
            --output world-generator/baleares-preview-public-verification.json \
            --screenshot /tmp/baleares-preview-public.png

      - name: Verify public mobile runtime 002
        id: runtime002_public
        shell: bash
        run: |
          set +e
          node world-generator/scripts/verify-region-runtime-002-browser.mjs \
            --url "$RUNTIME_002_URL" \
            --public \
            --output world-generator/baleares-runtime-002-public-verification.json \
            --screenshot /tmp/baleares-runtime-002-public.png \
            >world-generator/baleares-runtime-002-public-verification.log 2>&1
          code=$?
          set -e
          cat > world-generator/baleares-runtime-002-public-verification-status.json <<JSON
          {
            "verificationVersion": 1,
            "scope": "public",
            "exitCode": $code,
            "valid": $([ "$code" -eq 0 ] && echo true || echo false),
            "url": "$RUNTIME_002_URL"
          }
          JSON
          cat world-generator/baleares-runtime-002-public-verification-status.json
          cat world-generator/baleares-runtime-002-public-verification.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record public verification
        if: always()
        shell: bash
        run: |
          git add \
            world-generator/baleares-preview-public-verification.json \
            world-generator/baleares-runtime-002-public-verification-status.json \
            world-generator/baleares-runtime-002-public-verification.log
          git add world-generator/baleares-runtime-002-public-verification.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Verify public Baleares regional runtime 002"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require valid public runtime 002
        if: steps.runtime002_public.outputs.code != '0'
        run: exit 1

      - name: Upload preview and runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baleares-preview-and-runtime-002-screenshots
          path: |
            /tmp/baleares-preview-local.png
            /tmp/baleares-preview-public.png
            /tmp/baleares-runtime-002-local.png
            /tmp/baleares-runtime-002-public.png
          retention-days: 7
