name: Check Catalunya litoral pipeline

on:
  push:
    paths:
      - .github/workflows/check-catalunya-litoral-pipeline.yml
      - world-generator/configs/catalunya-litoral.region.json
      - world-generator/overrides/catalunya-litoral.overrides.json
      - world-generator/configs/source-registry.json
      - world-generator/scripts/build-region-v2.mjs
      - world-generator/scripts/import-openstreetmap-v2.py
      - world-generator/scripts/build-region-preview-v2.mjs
      - world-generator/scripts/verify-region-preview-v2.mjs
      - world-generator/scripts/build-region-preview-page.mjs
      - world-generator/scripts/verify-region-preview-browser-v2.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check config and scripts
        id: check
        shell: bash
        run: |
          set +e
          LOG=world-generator/catalunya-litoral-pipeline-check.log
          STATUS=world-generator/catalunya-litoral-pipeline-check-status.json
          : > "$LOG"
          code=0
          run_check() {
            echo "== $1 ==" >> "$LOG"
            shift
            "$@" >> "$LOG" 2>&1 || code=$?
          }
          run_check 'validate config' node world-generator/scripts/validate-region.mjs --config world-generator/configs/catalunya-litoral.region.json
          for script in \
            world-generator/scripts/build-region-v2.mjs \
            world-generator/scripts/build-region-preview-v2.mjs \
            world-generator/scripts/verify-region-preview-v2.mjs \
            world-generator/scripts/build-region-preview-page.mjs \
            world-generator/scripts/verify-region-preview-browser-v2.mjs; do
            run_check "node syntax ${script}" node --check "$script"
          done
          run_check 'python OSM wrapper syntax' python -m py_compile world-generator/scripts/import-openstreetmap-v2.py
          printf '{"valid":%s,"exitCode":%s}\n' "$([ "$code" = 0 ] && echo true || echo false)" "$code" > "$STATUS"
          cat "$LOG"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit pipeline check
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/catalunya-litoral-pipeline-check.log world-generator/catalunya-litoral-pipeline-check-status.json world-generator/validation-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Check Catalunya litoral generator pipeline"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Require success
        if: steps.check.outputs.code != '0'
        run: exit 1
