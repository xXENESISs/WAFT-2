name: Publish Baleares regional runtime 005

on:
  push:
    paths:
      - .github/workflows/publish-baleares-runtime-005.yml
      - world-generator/scripts/run-build-baleares-runtime-005.mjs
      - world-generator/scripts/build-baleares-runtime-005.mjs
      - world-generator/scripts/verify-baleares-runtime-005-browser.mjs
      - world-generator/scripts/run-build-local-zone.mjs
      - world-generator/scripts/run-verify-local-zone.mjs
      - mallorca-mobile/region-runtime-baleares-004.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-baleares-runtime-005
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Protect frozen build
        run: |
          sha256sum mallorca-mobile/waft-0155-estable.html mallorca-mobile/v155direct2-0{0..6}.js > /tmp/waft005-before.sha256

      - name: Build local package and runtime
        id: build
        shell: bash
        run: |
          set +e
          : > world-generator/baleares-runtime-005-effective-diagnostic.log
          exec > >(tee -a world-generator/baleares-runtime-005-effective-diagnostic.log) 2>&1

          node --check world-generator/scripts/run-build-baleares-runtime-005.mjs
          runner_syntax=$?
          node --check world-generator/scripts/verify-baleares-runtime-005-browser.mjs
          verifier_syntax=$?
          node world-generator/scripts/run-build-local-zone.mjs baleares llevant
          local_build=$?
          if [ "$local_build" -eq 0 ]; then
            node world-generator/scripts/run-verify-local-zone.mjs baleares llevant
            local_verify=$?
          else
            local_verify=99
          fi
          node world-generator/scripts/run-build-baleares-runtime-005.mjs
          runtime_build=$?

          inline_syntax=99
          deterministic=99
          if [ "$runtime_build" -eq 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('mallorca-mobile/region-runtime-baleares-005.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/runtime005-inline.mjs').write_text(scripts[0], encoding='utf-8')
          PY
            node --check /tmp/runtime005-inline.mjs
            inline_syntax=$?
          fi

          if [ "$runtime_build" -eq 0 ] && [ "$inline_syntax" -eq 0 ]; then
            cp mallorca-mobile/region-runtime-baleares-005.html /tmp/runtime005-first.html
            cp world-generator/baleares-runtime-005-build.json /tmp/runtime005-first.json
            node world-generator/scripts/run-build-baleares-runtime-005.mjs >/tmp/runtime005-rebuild.log
            rebuild=$?
            if [ "$rebuild" -eq 0 ]; then
              diff -q /tmp/runtime005-first.html mallorca-mobile/region-runtime-baleares-005.html
              html_diff=$?
              diff -q /tmp/runtime005-first.json world-generator/baleares-runtime-005-build.json
              report_diff=$?
              if [ "$html_diff" -eq 0 ] && [ "$report_diff" -eq 0 ]; then deterministic=0; else deterministic=1; fi
            fi
          fi

          printf '{"runnerSyntax":%s,"verifierSyntax":%s,"localBuild":%s,"localVerify":%s,"runtimeBuild":%s,"inlineSyntax":%s,"deterministic":%s}\n' \
            "$runner_syntax" "$verifier_syntax" "$local_build" "$local_verify" "$runtime_build" "$inline_syntax" "$deterministic" \
            > world-generator/baleares-runtime-005-effective-status.json
          cat world-generator/baleares-runtime-005-effective-status.json

          if [ "$runner_syntax" -eq 0 ] && [ "$verifier_syntax" -eq 0 ] && [ "$local_build" -eq 0 ] && [ "$local_verify" -eq 0 ] && [ "$runtime_build" -eq 0 ] && [ "$inline_syntax" -eq 0 ] && [ "$deterministic" -eq 0 ]; then
            echo "code=0" >> "$GITHUB_OUTPUT"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Install mobile browser verifier
        if: steps.build.outputs.code == '0'
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Verify local mobile runtime
        id: browser
        if: steps.build.outputs.code == '0'
        shell: bash
        run: |
          set +e
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/runtime005-server.log 2>&1 &
          pid=$!
          sleep 2
          node world-generator/scripts/verify-baleares-runtime-005-browser.mjs \
            --url "http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-005.html?v=local" \
            --output world-generator/baleares-runtime-005-local-browser.json \
            --screenshot /tmp/runtime005-local.png
          code=$?
          kill "$pid" || true
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Confirm frozen build unchanged
        if: always()
        run: |
          sha256sum mallorca-mobile/waft-0155-estable.html mallorca-mobile/v155direct2-0{0..6}.js > /tmp/waft005-after.sha256
          diff -u /tmp/waft005-before.sha256 /tmp/waft005-after.sha256

      - name: Commit diagnostics or runtime
        if: always()
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/baleares-runtime-005-effective-diagnostic.log world-generator/baleares-runtime-005-effective-status.json
          [ -f regions/baleares/local/llevant/llevant-local-v1.bin ] && git add regions/baleares/local/llevant/llevant-local-v1.bin
          [ -f regions/baleares/local/llevant/llevant-local-v1.json ] && git add regions/baleares/local/llevant/llevant-local-v1.json
          [ -f world-generator/baleares-llevant-local-build.json ] && git add world-generator/baleares-llevant-local-build.json
          [ -f world-generator/baleares-llevant-local-validation.json ] && git add world-generator/baleares-llevant-local-validation.json
          [ -f mallorca-mobile/region-runtime-baleares-005.html ] && git add mallorca-mobile/region-runtime-baleares-005.html
          [ -f world-generator/baleares-runtime-005-build.json ] && git add world-generator/baleares-runtime-005-build.json
          [ -f world-generator/baleares-runtime-005-local-browser.json ] && git add world-generator/baleares-runtime-005-local-browser.json
          if ! git diff --cached --quiet; then
            if [ "${{ steps.build.outputs.code }}" = "0" ] && [ "${{ steps.browser.outputs.code }}" = "0" ]; then
              git commit -m "Publish Baleares regional runtime 005"
            else
              git commit -m "Record effective Baleares runtime 005 diagnostics"
            fi
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require local success
        if: steps.build.outputs.code != '0' || steps.browser.outputs.code != '0'
        run: exit 1

      - name: Wait for public deployment
        shell: bash
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-005.html?v=${sha}"
          metadata="https://xxenesiss.github.io/WAFT-2/regions/baleares/local/llevant/llevant-local-v1.json?v=${sha}"
          expected="$(jq -r .buildId regions/baleares/local/llevant/llevant-local-v1.json)"
          echo "PUBLIC_RUNTIME_URL=${url}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            remote="$(curl -fsS --max-time 20 "$metadata" | jq -r .buildId 2>/dev/null || true)"
            if [ "$remote" = "$expected" ] && curl -fsS --max-time 20 "$url" | grep -q "RUNTIME REGIONAL 005"; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Verify public mobile runtime
        run: |
          node world-generator/scripts/verify-baleares-runtime-005-browser.mjs \
            --url "$PUBLIC_RUNTIME_URL" \
            --public \
            --output world-generator/baleares-runtime-005-public-verification.json \
            --screenshot /tmp/runtime005-public.png

      - name: Commit public verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/baleares-runtime-005-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify public Baleares regional runtime 005"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baleares-runtime-005
          path: |
            /tmp/runtime005-local.png
            /tmp/runtime005-public.png
          if-no-files-found: ignore
          retention-days: 7
