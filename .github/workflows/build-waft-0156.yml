name: Build WAFT 0.15.6

on:
  push:
    paths:
      - .github/workflows/build-waft-0156.yml
      - mallorca-mobile/build-waft-0156.mjs
      - mallorca-mobile/run-build-waft-0156.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and capture diagnostics
        id: compile
        shell: bash
        run: |
          set +e
          node mallorca-mobile/run-build-waft-0156.mjs > mallorca-mobile/waft-0156-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat mallorca-mobile/waft-0156-build.log
          exit 0

      - name: Validate direct build structure
        if: steps.compile.outputs.exit_code == '0'
        shell: bash
        run: |
          test -s mallorca-mobile/waft-0156.html
          grep -Fq '<title>WAFT Adventure 0.15.6 · Mallorca habitable</title>' mallorca-mobile/waft-0156.html
          grep -Fq 'WAFT ADVENTURE 0.15.6 · MALLORCA HABITABLE' mallorca-mobile/waft-0156.html
          grep -Fq 'Campanar de Manacor' mallorca-mobile/waft-0156.html
          grep -Fq 'Castell de sa Punta de n Amer' mallorca-mobile/waft-0156.html
          grep -Fq 'Porc negre mallorquí' mallorca-mobile/waft-0156.html
          if grep -Eqi '<script[^>]+src=' mallorca-mobile/waft-0156.html; then
            echo 'The build has an external script dependency' >&2
            exit 1
          fi

      - name: Record result on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.compile.outputs.exit_code }}" = "0" ]; then
            printf 'ok\n' > mallorca-mobile/waft-0156-build-status.txt
            git add mallorca-mobile/waft-0156.html mallorca-mobile/waft-0156-build-status.txt mallorca-mobile/waft-0156-build.log
          else
            printf 'failed\n' > mallorca-mobile/waft-0156-build-status.txt
            git add mallorca-mobile/waft-0156-build-status.txt mallorca-mobile/waft-0156-build.log
          fi
          git commit -m "Record WAFT Adventure 0.15.6 build result"
          git push origin HEAD:main

      - name: Fail when compilation failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
