name: Build WAFT 0.15.6

on:
  push:
    paths:
      - .github/workflows/build-waft-0156.yml
      - mallorca-mobile/build-waft-0156.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build direct self-contained HTML
        run: node mallorca-mobile/build-waft-0156.mjs

      - name: Validate direct build structure
        shell: bash
        run: |
          test -s mallorca-mobile/waft-0156.html
          grep -Fq '<title>WAFT Adventure 0.15.6 · Mallorca habitable</title>' mallorca-mobile/waft-0156.html
          grep -Fq 'WAFT ADVENTURE 0.15.6 · MALLORCA HABITABLE' mallorca-mobile/waft-0156.html
          grep -Fq 'Campanar de Manacor' mallorca-mobile/waft-0156.html
          grep -Fq 'Castell de sa Punta de n Amer' mallorca-mobile/waft-0156.html
          grep -Fq 'Porc negre mallorquí' mallorca-mobile/waft-0156.html
          if grep -Eqi '<script[^>]+src=' mallorca-mobile/waft-0156.html; then
            echo 'The build has an external script dependency' >&2
            exit 1
          fi

      - name: Commit new version only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mallorca-mobile/waft-0156.html
          if git diff --cached --quiet; then
            echo 'Build already current'
            exit 0
          fi
          git commit -m "Build WAFT Adventure 0.15.6"
          git push origin HEAD:main
