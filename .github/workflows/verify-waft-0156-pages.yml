name: Verify WAFT 0.15.6 Pages

on:
  push:
    paths:
      - .github/workflows/verify-waft-0156-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-waft-0156-pages
  cancel-in-progress: true

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the real GitHub Pages file
        id: pages
        shell: bash
        run: |
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/waft-0156.html?v=${GITHUB_SHA}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          : > mallorca-mobile/waft-0156-pages-verification.log
          ok=0
          for attempt in $(seq 1 72); do
            code=$(curl -sS -L --max-time 25 -o /tmp/waft-0156-pages.html -w '%{http_code}' "$url" || true)
            printf 'attempt=%s http=%s bytes=%s\n' "$attempt" "${code:-000}" "$(wc -c </tmp/waft-0156-pages.html 2>/dev/null || echo 0)" | tee -a mallorca-mobile/waft-0156-pages-verification.log
            if [ "$code" = "200" ] \
              && grep -Fq '<title>WAFT Adventure 0.15.6 · Mallorca habitable</title>' /tmp/waft-0156-pages.html \
              && grep -Fq 'WAFT ADVENTURE 0.15.6 · MALLORCA HABITABLE' /tmp/waft-0156-pages.html \
              && grep -Fq 'Campanar de Manacor' /tmp/waft-0156-pages.html \
              && grep -Fq 'Castell de sa Punta de n Amer' /tmp/waft-0156-pages.html \
              && cmp -s /tmp/waft-0156-pages.html mallorca-mobile/waft-0156.html; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "pages_ok=$ok" >> "$GITHUB_OUTPUT"
          printf 'pages_ok=%s\nurl=%s\n' "$ok" "$url" >> mallorca-mobile/waft-0156-pages-verification.log

      - name: Open public build and validate startup
        id: browser
        env:
          WAFT_URL: ${{ steps.pages.outputs.url }}
          PAGES_OK: ${{ steps.pages.outputs.pages_ok }}
        shell: bash
        run: |
          ok=0
          if [ "$PAGES_OK" = "1" ]; then
            set +e
            mkdir -p /tmp/waft-browser-check
            cd /tmp/waft-browser-check
            npm init -y >>"$GITHUB_WORKSPACE/mallorca-mobile/waft-0156-pages-verification.log" 2>&1
            npm install playwright-core@latest >>"$GITHUB_WORKSPACE/mallorca-mobile/waft-0156-pages-verification.log" 2>&1
            chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
            printf 'chrome=%s\n' "$chrome" >>"$GITHUB_WORKSPACE/mallorca-mobile/waft-0156-pages-verification.log"
            cat > verify.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-gpu-sandbox','--disable-dev-shm-usage']
            });
            const page = await browser.newPage({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 1 });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error && error.stack || error)));
            const response = await page.goto(process.env.WAFT_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`Unexpected HTTP status: ${response && response.status()}`);
            await page.waitForFunction(() => {
              const loading = document.querySelector('#loading');
              return Boolean(window.WAFT_DEBUG && loading && loading.classList.contains('hidden'));
            }, null, { timeout: 120000 });
            await page.waitForTimeout(3500);
            const state = await page.evaluate(() => {
              const error = document.querySelector('#error');
              const canvas = document.querySelector('#view');
              const debug = window.WAFT_DEBUG;
              return {
                title: document.title,
                hud: document.querySelector('#hud h1')?.textContent || '',
                errorVisible: Boolean(error && getComputedStyle(error).display !== 'none'),
                errorText: document.querySelector('#errorText')?.textContent || '',
                loadingHidden: document.querySelector('#loading')?.classList.contains('hidden') || false,
                webgl: Boolean(canvas && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'))),
                pigs: Array.isArray(debug?.pigs) ? debug.pigs.length : -1,
                cows: Array.isArray(debug?.cows) ? debug.cows.length : -1,
                landmarks: Array.isArray(debug?.landmarks) ? debug.landmarks.map(item => item.id) : [],
                colliderCount: Array.isArray(debug?.colliders) ? debug.colliders.length : -1
              };
            });
            if (state.title !== 'WAFT Adventure 0.15.6 · Mallorca habitable') throw new Error(`Wrong title: ${state.title}`);
            if (!state.hud.includes('0.15.6 · MALLORCA HABITABLE')) throw new Error(`Wrong HUD: ${state.hud}`);
            if (!state.loadingHidden) throw new Error('Loading screen did not finish');
            if (state.errorVisible) throw new Error(`Game error screen visible: ${state.errorText}`);
            if (!state.webgl) throw new Error('WebGL context unavailable');
            if (state.pigs !== 5) throw new Error(`Expected 5 Mallorcan black pigs, got ${state.pigs}`);
            if (state.cows !== 5) throw new Error(`Expected 5 Menorcan cows, got ${state.cows}`);
            if (!state.landmarks.includes('manacor') || !state.landmarks.includes('puntaamer')) throw new Error(`Missing new landmarks: ${state.landmarks.join(',')}`);
            if (state.colliderCount < 20) throw new Error(`Collider set looks incomplete: ${state.colliderCount}`);
            if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join('\n')}`);
            const report = {
              version: '0.15.6',
              verified: true,
              pages_url: process.env.WAFT_URL,
              trigger_commit: process.env.GITHUB_SHA,
              verified_at: new Date().toISOString(),
              checks: {
                http_200: true,
                pages_matches_main: true,
                javascript_syntax: true,
                startup_completed: true,
                webgl_context: true,
                no_page_errors: true,
                new_landmarks_loaded: state.landmarks,
                mallorcan_black_pigs: state.pigs,
                menorcan_cows: state.cows,
                collider_count: state.colliderCount
              }
            };
            fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/mallorca-mobile/waft-0156-verified.json', JSON.stringify(report, null, 2) + '\n');
            await browser.close();
          })().catch(error => { console.error(error && error.stack || error); process.exit(1); });
          NODE
            CHROME_PATH="$chrome" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" WAFT_URL="$WAFT_URL" node verify.cjs >>"$GITHUB_WORKSPACE/mallorca-mobile/waft-0156-pages-verification.log" 2>&1
            code=$?
            if [ "$code" = "0" ]; then ok=1; fi
            set -e
          fi
          echo "browser_ok=$ok" >> "$GITHUB_OUTPUT"
          printf 'browser_ok=%s\n' "$ok" >>"$GITHUB_WORKSPACE/mallorca-mobile/waft-0156-pages-verification.log"

      - name: Record public verification result
        env:
          WAFT_URL: ${{ steps.pages.outputs.url }}
          PAGES_OK: ${{ steps.pages.outputs.pages_ok }}
          BROWSER_OK: ${{ steps.browser.outputs.browser_ok }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          result = {
            'version': '0.15.6',
            'trigger_commit': os.environ['GITHUB_SHA'],
            'pages_url': os.environ['WAFT_URL'],
            'pages_ok': os.environ['PAGES_OK'] == '1',
            'browser_ok': os.environ['BROWSER_OK'] == '1'
          }
          with open('mallorca-mobile/waft-0156-verification-status.json','w',encoding='utf-8') as f:
            json.dump(result,f,ensure_ascii=False,indent=2)
            f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mallorca-mobile/waft-0156-pages-verification.log mallorca-mobile/waft-0156-verification-status.json
          if [ -f mallorca-mobile/waft-0156-verified.json ]; then git add mallorca-mobile/waft-0156-verified.json; fi
          git commit -m "Record WAFT Adventure 0.15.6 Pages verification"
          git push origin HEAD:main

      - name: Require successful public verification
        if: steps.pages.outputs.pages_ok != '1' || steps.browser.outputs.browser_ok != '1'
        run: exit 1
