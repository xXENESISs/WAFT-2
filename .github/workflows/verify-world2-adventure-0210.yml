name: Verify World 2 Adventure 0.24.9

on:
  push:
    branches:
      - agent/world2-penguin-integration-0210
      - agent/playability-0230
      - agent/mobile-hud-shark-0231
      - agent/mobility-regression-0232
      - agent/world1-parity-0233
      - agent/mobile-stability-performance-hotfix
      - agent/barcelona-swim-place-labels-0234
      - agent/barcelona-continuity-0235
      - agent/barcelona-corridor-edge-hotfix
      - agent/multimodal-barcelona-crossing-0236
      - agent/bidirectional-barcelona-return-0237
      - agent/barcelona-playability-0238
      - agent/ecozones-fauna-0239
      - agent/iberia-terrain-0240
      - agent/iberia-polish-0243
      - agent/world-streaming-foundation-0244
      - fix/verify-world2-0245
      - fix/ci-world-0246
      - fix/world-0247-continuity-labels-canarias
      - fix/world-0248-hotfix-render-cities
      - feat/world-0249-ui-labels-scale-foundation
      - main
    paths:
      - mallorca-mobile/adventure-0210/**
      - mallorca-mobile/region-runtime-baleares-013.html
      - mallorca-mobile/region-runtime-catalunya-litoral-003.html
      - world-generator/configs/spain-region-topology.v1.json
      - world-generator/configs/iberia.region.json
      - world-generator/configs/france.region.json
      - world-generator/configs/canarias.region.json
      - world-generator/configs/world-streaming-topology.v1.json
      - world-generator/scripts/prepare-iberia-0243.mjs
      - world-generator/scripts/prepare-iberia-0244.mjs
      - world-generator/scripts/prepare-iberia-0245.mjs
      - world-generator/scripts/tune-vulture-flight-0245.mjs
      - world-generator/scripts/prepare-world-0246.mjs
      - world-generator/scripts/prepare-world-0247.mjs
      - world-generator/scripts/ensure-iberia-settlements-0246.mjs
      - world-generator/scripts/smoke-iberia-terrain-0240.mjs
      - world-generator/scripts/smoke-world-expansion-0244.mjs
      - regions/iberia/**
      - regions/france/**
      - regions/canarias/**
      - .github/workflows/verify-world2-adventure-0210.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Syntax checks
        working-directory: repo
        run: |
          node --check mallorca-mobile/adventure-0210/plugin-loader.js
          node --check mallorca-mobile/adventure-0210/gameplay-plugin.js
          node --check mallorca-mobile/adventure-0210/playability-0230.js
          node --check mallorca-mobile/adventure-0210/mobile-polish-0231.js
          node --check mallorca-mobile/adventure-0210/mechanics-0232.js
          node --check mallorca-mobile/adventure-0210/world1-parity-0233.js
          node --check mallorca-mobile/adventure-0210/navigation-0234.js
          node --check mallorca-mobile/adventure-0210/multimodal-crossing-0236.js
          node --check mallorca-mobile/adventure-0210/bidirectional-crossing-0237.js
          node --check mallorca-mobile/adventure-0210/barcelona-playability-0238.js
          node --check mallorca-mobile/adventure-0210/ecology-0239.js
          node --check mallorca-mobile/adventure-0210/iberia-explorer-0242.js
          node --check mallorca-mobile/adventure-0210/iberia-polish-0243.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0244.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0245.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0246.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0247.js
          node --check mallorca-mobile/adventure-0210/iberia-world-0249.js
          node --check mallorca-mobile/adventure-0210/verify-0249.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-visible-reality-0246.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-core-continuity-0249.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-world-ui-0249.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-atlantic-0247.mjs
          node --check world-generator/scripts/prepare-world-0246.mjs
          node --check world-generator/scripts/prepare-world-0247.mjs
          node --check world-generator/scripts/ensure-iberia-settlements-0246.mjs
          node --check world-generator/scripts/smoke-world-expansion-0244.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-navigation-0235.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-plugin-loader-0239.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-multimodal-0236.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-bidirectional-0237.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-barcelona-0238.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-ecology-0239.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-iberia-adventure-0240.mjs
          node --check world-generator/scripts/smoke-iberia-terrain-0240.mjs
          node -e "JSON.parse(require('fs').readFileSync('world-generator/configs/spain-region-topology.v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('world-generator/configs/world-streaming-topology.v1.json','utf8'))"
      - name: Static parity and visible-world verification
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/verify-0249.mjs
      - name: Compile patched regional runtimes
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-patched-runtime.mjs
      - name: Compile actual gameplay loader output
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-plugin-loader-0239.mjs
      - name: Verify navigation continuity
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-navigation-0235.mjs
      - name: Verify multimodal Barcelona crossing
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-multimodal-0236.mjs
      - name: Verify bidirectional Mallorca return
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-bidirectional-0237.mjs
      - name: Verify Barcelona playability
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-barcelona-0238.mjs
      - name: Verify ecological zones and fauna placement
        working-directory: repo
        run: node mallorca-mobile/adventure-0210/tools/smoke-ecology-0239.mjs
      - name: Verify Iberia and world foundation
        working-directory: repo
        run: |
          node world-generator/scripts/smoke-iberia-terrain-0240.mjs
          node mallorca-mobile/adventure-0210/tools/smoke-iberia-adventure-0240.mjs
          node world-generator/scripts/smoke-world-expansion-0244.mjs

# 0.24.9 retains the full parity suite and adds one authoritative world HUD plus shared nearby settlement labels with population/☠️.
