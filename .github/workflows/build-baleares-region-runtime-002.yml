name: Build Baleares regional runtime 002

on:
  push:
    paths:
      - .github/workflows/build-baleares-region-runtime-002.yml
      - world-generator/scripts/build-baleares-runtime-002.mjs
      - world-generator/scripts/verify-region-runtime-002-browser.mjs
      - mallorca-mobile/region-runtime-baleares-001.html
      - regions/baleares/preview/baleares-preview-v1.bin
      - regions/baleares/preview/baleares-preview-v1.json
      - regions/baleares/terrain.bin
      - regions/baleares/landcover.bin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baleares-region-runtime-002
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record frozen 0.15.5 files
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-runtime-002-before.sha256

      - name: Check builder and verifier syntax
        shell: bash
        run: |
          node --check world-generator/scripts/build-baleares-runtime-002.mjs
          node --check world-generator/scripts/verify-region-runtime-002-browser.mjs

      - name: Build deterministic runtime 002
        shell: bash
        run: |
          node world-generator/scripts/build-baleares-runtime-002.mjs | tee world-generator/baleares-runtime-002-build.log
          cp mallorca-mobile/region-runtime-baleares-002.html /tmp/region-runtime-baleares-002-first.html
          cp world-generator/baleares-runtime-002-build.json /tmp/baleares-runtime-002-first.json
          node world-generator/scripts/build-baleares-runtime-002.mjs >/tmp/baleares-runtime-002-rebuild.log
          diff -q /tmp/region-runtime-baleares-002-first.html mallorca-mobile/region-runtime-baleares-002.html
          diff -q /tmp/baleares-runtime-002-first.json world-generator/baleares-runtime-002-build.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('mallorca-mobile/region-runtime-baleares-002.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/region-runtime-002-inline.mjs').write_text(scripts[0], encoding='utf-8')
          required = [
              'RUNTIME REGIONAL 002',
              '__WAFT_RUNTIME_002_READY__',
              'createSphereGeometry',
              'resolveThirdPersonCamera',
              "cameraMode: 'third-person'",
              "version: '002'"
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit(f'Missing runtime 002 marker: {marker}')
          PY
          node --check /tmp/region-runtime-002-inline.mjs

      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Verify runtime 002 in local mobile browser
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/baleares-runtime-002-server.log 2>&1 &
          echo $! >/tmp/baleares-runtime-002-server.pid
          sleep 2
          node world-generator/scripts/verify-region-runtime-002-browser.mjs \
            --url "http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-002.html?v=local" \
            --output world-generator/baleares-runtime-002-local-browser.json \
            --screenshot /tmp/baleares-runtime-002-local.png
          kill "$(cat /tmp/baleares-runtime-002-server.pid)" || true

      - name: Confirm frozen build is untouched
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-runtime-002-after.sha256
          diff -u /tmp/waft-0155-runtime-002-before.sha256 /tmp/waft-0155-runtime-002-after.sha256

      - name: Commit runtime 002
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mallorca-mobile/region-runtime-baleares-002.html \
            world-generator/baleares-runtime-002-build.json \
            world-generator/baleares-runtime-002-build.log \
            world-generator/baleares-runtime-002-local-browser.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Baleares regional runtime 002"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          RUNTIME_COMMIT="$(git rev-parse HEAD)"
          echo "commit=${RUNTIME_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_COMMIT=${RUNTIME_COMMIT}" >> "$GITHUB_ENV"
          echo "RUNTIME_BUILD_ID=$(jq -r .buildId regions/baleares/preview/baleares-preview-v1.json)" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages
        shell: bash
        run: |
          PAGE_URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-002.html?v=${RUNTIME_COMMIT}"
          DATA_URL="https://xxenesiss.github.io/WAFT-2/regions/baleares/preview/baleares-preview-v1.json?v=${RUNTIME_COMMIT}"
          echo "PAGE_URL=${PAGE_URL}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            REMOTE_BUILD="$(curl -fsS --max-time 20 "$DATA_URL" | jq -r .buildId 2>/dev/null || true)"
            if [ "$REMOTE_BUILD" = "$RUNTIME_BUILD_ID" ] && curl -fsS --max-time 20 "$PAGE_URL" | grep -q "RUNTIME REGIONAL 002"; then
              echo "GitHub Pages serves runtime 002 ${RUNTIME_BUILD_ID}"
              exit 0
            fi
            echo "Waiting for Pages (${attempt}/60): remote=${REMOTE_BUILD:-missing} expected=${RUNTIME_BUILD_ID}"
            sleep 5
          done
          echo "GitHub Pages did not publish runtime 002 in time" >&2
          exit 1

      - name: Verify public mobile runtime 002
        shell: bash
        run: |
          node world-generator/scripts/verify-region-runtime-002-browser.mjs \
            --url "$PAGE_URL" \
            --public \
            --output world-generator/baleares-runtime-002-public-verification.json \
            --screenshot /tmp/baleares-runtime-002-public.png

      - name: Record public verification
        shell: bash
        run: |
          git add world-generator/baleares-runtime-002-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify public Baleares regional runtime 002"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload runtime 002 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: baleares-region-runtime-002-screenshots
          path: |
            /tmp/baleares-runtime-002-local.png
            /tmp/baleares-runtime-002-public.png
          retention-days: 7
