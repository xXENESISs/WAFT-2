name: Verify WAFT world 0.27.0 experimental planet

on:
  push:
    branches:
      - feat/world-0270-persistent-planet
    paths:
      - .github/workflows/build-world-0270-experimental.yml
      - mallorca-mobile/adventure-0210/index.html
      - mallorca-mobile/adventure-0210/planet-world-0270.js
      - mallorca-mobile/adventure-0210/planet-0270/**
      - mallorca-mobile/adventure-0210/verify-0270.mjs
      - mallorca-mobile/adventure-0210/tools/verify-cube-sphere-0270.mjs
      - mallorca-mobile/adventure-0210/tools/verify-planet-world-0270.mjs
      - world-generator/scripts/prepare-world-0261.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waft-world-0270-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-planet-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Syntax and planet contracts
        run: |
          node --check mallorca-mobile/adventure-0210/planet-world-0270.js
          node --check mallorca-mobile/adventure-0210/planet-0270/cube-sphere-core.mjs
          node --check mallorca-mobile/adventure-0210/verify-0270.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-cube-sphere-0270.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-planet-world-0270.mjs
          node mallorca-mobile/adventure-0210/tools/verify-cube-sphere-0270.mjs
          node mallorca-mobile/adventure-0210/verify-0270.mjs
      - name: Preserve the public 0.26.1 contracts
        run: |
          node world-generator/scripts/prepare-world-0261.mjs
          git diff --exit-code -- mallorca-mobile/adventure-0210/index.html mallorca-mobile/adventure-0210/spherical-world-0261.js mallorca-mobile/adventure-0210/iberia-world-0246.js
          node mallorca-mobile/adventure-0210/verify-0261.mjs
          node mallorca-mobile/adventure-0210/tools/smoke-patched-runtime.mjs
      - name: Verify stationary coast and planet traversal in Chromium
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-0270-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node mallorca-mobile/adventure-0210/tools/verify-planet-world-0270.mjs "http://127.0.0.1:8000/mallorca-mobile/adventure-0210/index.html?region=iberia&renderer=0270&v=ci-${GITHUB_SHA}"
      - name: Upload experimental planet checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waft-planet-world-0270-visuals
          path: artifacts/world-0270/*.png
          if-no-files-found: error
