name: Diagnose Baleares regional runtime

on:
  push:
    paths:
      - .github/workflows/diagnose-baleares-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          : > world-generator/baleares-runtime-diagnostic.log
          node --check world-generator/scripts/build-baleares-runtime.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
          SYNTAX=$?
          node world-generator/scripts/build-baleares-runtime.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
          BUILD=$?
          INLINE=99
          BROWSER=99
          if [ "$BUILD" -eq 0 ]; then
            python3 - <<'PY' >>world-generator/baleares-runtime-diagnostic.log 2>&1
          from pathlib import Path
          import re
          html = Path('mallorca-mobile/region-runtime-baleares-001.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/region-runtime-inline.mjs').write_text(scripts[0], encoding='utf-8')
          PY
            INLINE_EXTRACT=$?
            if [ "$INLINE_EXTRACT" -eq 0 ]; then
              node --check /tmp/region-runtime-inline.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
              INLINE=$?
            else
              INLINE=$INLINE_EXTRACT
            fi
          fi
          if [ "$BUILD" -eq 0 ] && [ "$INLINE" -eq 0 ]; then
            npm install --no-save --no-package-lock playwright-core@1.55.0 >>world-generator/baleares-runtime-diagnostic.log 2>&1
            INSTALL=$?
            if [ "$INSTALL" -eq 0 ]; then
              python3 -m http.server 8000 --bind 127.0.0.1 >>world-generator/baleares-runtime-diagnostic.log 2>&1 &
              SERVER_PID=$!
              sleep 2
              node world-generator/scripts/verify-region-runtime-browser.mjs \
                --url "http://127.0.0.1:8000/mallorca-mobile/region-runtime-baleares-001.html?v=diagnostic" \
                --output world-generator/baleares-runtime-diagnostic-browser.json \
                --screenshot /tmp/baleares-runtime-diagnostic.png >>world-generator/baleares-runtime-diagnostic.log 2>&1
              BROWSER=$?
              kill "$SERVER_PID" || true
            else
              BROWSER=$INSTALL
            fi
          fi
          cat > world-generator/baleares-runtime-diagnostic-status.json <<JSON
          {
            "diagnosticVersion": 1,
            "syntax": $SYNTAX,
            "build": $BUILD,
            "inlineSyntax": $INLINE,
            "browser": $BROWSER
          }
          JSON
          cat world-generator/baleares-runtime-diagnostic-status.json
          exit 0

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/baleares-runtime-diagnostic.log \
            world-generator/baleares-runtime-diagnostic-status.json \
            world-generator/baleares-runtime-diagnostic-browser.json \
            mallorca-mobile/region-runtime-baleares-001.html \
            world-generator/baleares-runtime-build.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Baleares runtime diagnostic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
