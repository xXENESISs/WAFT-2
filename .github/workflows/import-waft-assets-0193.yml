name: Import WAFT Assets 0.19.3

on:
  workflow_dispatch:
  push:
    branches: [agent/fixed-joystick-assets-0193]
    paths:
      - mallorca-mobile/assets-import-plan-0193.json
      - mallorca-mobile/tools/import-polyhaven-assets-0193.mjs
      - .github/workflows/import-waft-assets-0193.yml

permissions:
  contents: write

concurrency:
  group: import-waft-assets-0193
  cancel-in-progress: true

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fixed-joystick-assets-0193
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Import licensed 1K assets
        run: |
          node --check mallorca-mobile/tools/import-polyhaven-assets-0193.mjs
          node mallorca-mobile/tools/import-polyhaven-assets-0193.mjs
      - name: Commit imported assets and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mallorca-mobile/assets/vendor/polyhaven
          if ! git diff --cached --quiet; then
            git commit -m "Import CC0 WAFT assets for 0.19.3"
            git pull --rebase origin agent/fixed-joystick-assets-0193
            git push origin HEAD:agent/fixed-joystick-assets-0193
          fi
