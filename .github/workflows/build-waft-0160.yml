name: Build WAFT Adventure 0.16.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - world-generator/build-waft-0160.js
      - .github/workflows/build-waft-0160.yml

permissions:
  contents: write

concurrency:
  group: build-waft-0160
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair, build and validate
        shell: bash
        run: |
          set +e
          mkdir -p world-generator
          : > world-generator/waft-0160-workflow.log

          python3 >> world-generator/waft-0160-workflow.log 2>&1 <<'PY'
          from pathlib import Path
          path = Path('world-generator/build-waft-0160.js')
          text = path.read_text()
          replacements = [
              ('}`,' + '\n' + '    "', '}`",' + '\n' + '    "'),
              ('}`,' + '\n' + "    '", '}`",' + '\n' + "    '")
          ]
          repaired = 0
          for broken, fixed in replacements:
              count = text.count(broken)
              repaired += count
              text = text.replace(broken, fixed)
          path.write_text(text)
          print(f'Repaired {repaired} malformed shader boundary/boundaries')
          PY
          REPAIR=$?
          if [ "$REPAIR" -eq 0 ]; then
            node --check world-generator/build-waft-0160.js >> world-generator/waft-0160-workflow.log 2>&1
            REPAIR=$?
          fi

          BUILD=99
          if [ "$REPAIR" -eq 0 ]; then
            node world-generator/build-waft-0160.js >> world-generator/waft-0160-workflow.log 2>&1
            BUILD=$?
          fi

          VALIDATION=99
          if [ "$BUILD" -eq 0 ]; then
            node >> world-generator/waft-0160-workflow.log 2>&1 <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const files = [
            'mallorca-mobile/region-runtime-baleares-012.html',
            'mallorca-mobile/region-runtime-catalunya-litoral-002.html',
            'mallorca-mobile/waft-0160.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            if (!html.endsWith('</html>') && !html.endsWith('</html>\n')) throw new Error(file + ': HTML incompleto');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
            if (!scripts.length) throw new Error(file + ': sin JavaScript');
            for (const script of scripts) new Function(script);
          }
          const adventure = fs.readFileSync(files[2], 'utf8');
          for (const marker of ['waft-adventure-0160-visual-access-v1','region-runtime-baleares-012.html','region-runtime-catalunya-litoral-002.html','state.exitDistance <= 32','state.movementSinceLoad >= .35','travelActivationRadius: 32']) {
            if (!adventure.includes(marker)) throw new Error('Aventura sin marcador: ' + marker);
          }
          for (const file of files.slice(0, 2)) {
            const html = fs.readFileSync(file, 'utf8');
            for (const marker of ["Math.max(16, Math.min(32, Number(zone.regionalRadius) * .82))","graphicsProfile: 'enhanced-mobile-v3'",'drawPart(0, .67, -.46','createSphereGeometry(gl, 16, 11)','#scaleMode.ready','roofFor(int kind)']) {
              if (!html.includes(marker)) throw new Error(file + ': falta ' + marker);
            }
            if (html.includes('drawPart(0, 1.08, -1.00')) throw new Error(file + ': conserva cola larga antigua');
          }
          const protectedFiles = {
            'mallorca-mobile/waft-0158.html':'b605801b9b18cf5d88e24968b9674db0503eef21',
            'mallorca-mobile/region-runtime-baleares-011.html':'54efca64586886fdd2f385f928489c786f925f31'
          };
          for (const [file, expected] of Object.entries(protectedFiles)) {
            const actual = execFileSync('git',['hash-object',file],{encoding:'utf8'}).trim();
            if (actual !== expected) throw new Error(file + ': protegido modificado');
          }
          const status = JSON.parse(fs.readFileSync('world-generator/waft-0160-build-status.json','utf8'));
          status.validation = {syntax:0,protectedSources:0,generatedFiles:0,markers:0,validatedAt:new Date().toISOString()};
          fs.writeFileSync('world-generator/waft-0160-build-status.json',JSON.stringify(status,null,2)+'\n');
          console.log(JSON.stringify({valid:true,files},null,2));
          NODE
            VALIDATION=$?
          fi

          node - "$REPAIR" "$BUILD" "$VALIDATION" <<'NODE'
          const fs = require('fs');
          const repair = Number(process.argv[2]);
          const build = Number(process.argv[3]);
          const validation = Number(process.argv[4]);
          fs.writeFileSync('world-generator/waft-0160-workflow-status.json',JSON.stringify({repair,build,validation,success:repair===0&&build===0&&validation===0,recordedAt:new Date().toISOString()},null,2)+'\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/build-waft-0160.js world-generator/waft-0160-workflow.log world-generator/waft-0160-workflow-status.json
          for file in world-generator/waft-0160-build-status.json mallorca-mobile/region-runtime-baleares-012.html mallorca-mobile/region-runtime-catalunya-litoral-002.html mallorca-mobile/waft-0160.html; do
            [ -f "$file" ] && git add "$file"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Generate WAFT Adventure 0.16.0 diagnostics"
            git push origin HEAD:main
          fi
          [ "$REPAIR" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$VALIDATION" -eq 0 ]
