name: Patch WAFT 0.15.9 generator escaping

on:
  push:
    paths:
      - .github/workflows/patch-waft-0159-generator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Escape generated error newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('world-generator/scripts/build-adventure-0159.mjs')
          text = path.read_text(encoding='utf-8')
          old = "errorBox.textContent = 'No se pudo abrir WAFT Adventure 0.15.9.\\n\\n' +"
          new = "errorBox.textContent = 'No se pudo abrir WAFT Adventure 0.15.9.\\\\n\\\\n' +"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit corrected generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/scripts/build-adventure-0159.mjs
          git commit -m "Fix WAFT 0.15.9 generated error string"
          git pull --rebase origin main
          git push origin HEAD:main
