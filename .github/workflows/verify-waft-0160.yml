name: Verify WAFT Adventure 0.16.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-waft-0160.yml
      - world-generator/scripts/verify-adventure-0160-browser.mjs
      - mallorca-mobile/waft-0160.html
      - mallorca-mobile/region-runtime-baleares-012.html
      - mallorca-mobile/region-runtime-catalunya-litoral-002.html

permissions:
  contents: write

concurrency:
  group: verify-waft-0160
  cancel-in-progress: true

jobs:
  verify-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Run and persist local mobile verification
        shell: bash
        run: |
          set +e
          : > world-generator/waft-0160-browser.log
          node --check world-generator/scripts/verify-adventure-0160-browser.mjs >> world-generator/waft-0160-browser.log 2>&1
          SYNTAX=$?
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-0160-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          LOCAL=99
          if [ "$SYNTAX" -eq 0 ]; then
            node world-generator/scripts/verify-adventure-0160-browser.mjs \
              --url http://127.0.0.1:8000/mallorca-mobile/waft-0160.html?v=waft-adventure-0160-visual-access-v1 \
              --output world-generator/waft-0160-local-browser.json \
              --screenshot /tmp/waft-0160-local.png \
              >> world-generator/waft-0160-browser.log 2>&1
            LOCAL=$?
          fi
          kill "$SERVER_PID" >/dev/null 2>&1 || true
          node - "$SYNTAX" "$LOCAL" <<'NODE'
          const fs = require('fs');
          const syntax = Number(process.argv[2]);
          const local = Number(process.argv[3]);
          fs.writeFileSync('world-generator/waft-0160-browser-status.json', JSON.stringify({syntax,local,public:99,success:syntax===0&&local===0,recordedAt:new Date().toISOString()}, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/waft-0160-browser.log world-generator/waft-0160-browser-status.json
          [ -f world-generator/waft-0160-local-browser.json ] && git add world-generator/waft-0160-local-browser.json
          if ! git diff --cached --quiet; then
            git commit -m "Record WAFT Adventure 0.16.0 local browser verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          [ "$SYNTAX" -eq 0 ] && [ "$LOCAL" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waft-adventure-0160-local
          path: /tmp/waft-0160-local.png
          if-no-files-found: ignore
          retention-days: 7
