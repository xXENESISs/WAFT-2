name: Verify WAFT Adventure 0.16.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-waft-0160.yml
      - world-generator/scripts/verify-adventure-0160-browser.mjs
      - mallorca-mobile/waft-0160.html
      - mallorca-mobile/region-runtime-baleares-012.html
      - mallorca-mobile/region-runtime-catalunya-litoral-002.html

permissions:
  contents: write

# Registered workflow revision: run local and public mobile verification.
concurrency:
  group: verify-waft-0160
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Verify local mobile build
        shell: bash
        run: |
          set -euo pipefail
          node --check world-generator/scripts/verify-adventure-0160-browser.mjs
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-0160-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          sleep 2
          node world-generator/scripts/verify-adventure-0160-browser.mjs \
            --url http://127.0.0.1:8000/mallorca-mobile/waft-0160.html?v=waft-adventure-0160-visual-access-v1 \
            --output world-generator/waft-0160-local-browser.json \
            --screenshot /tmp/waft-0160-local.png \
            > world-generator/waft-0160-browser.log 2>&1

      - name: Wait for exact public build
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/waft-0160.html?v=waft-adventure-0160-visual-access-v1"
          echo "WAFT_0160_PUBLIC_URL=${page_url}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 150); do
            page="$(curl -fsS --max-time 20 "$page_url" || true)"
            baleares="$(curl -fsS --max-time 20 "https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-012.html?v=waft-adventure-0160-visual-access-v1" || true)"
            catalunya="$(curl -fsS --max-time 20 "https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-catalunya-litoral-002.html?v=waft-adventure-0160-visual-access-v1" || true)"
            if printf '%s' "$page" | grep -q 'waft-adventure-0160-visual-access-v1' \
              && printf '%s' "$page" | grep -q 'region-runtime-baleares-012.html' \
              && printf '%s' "$page" | grep -q 'region-runtime-catalunya-litoral-002.html' \
              && printf '%s' "$baleares" | grep -q "enhanced-mobile-v3" \
              && printf '%s' "$catalunya" | grep -q "enhanced-mobile-v3"; then
              exit 0
            fi
            sleep 4
          done
          echo "GitHub Pages did not publish the exact WAFT 0.16.0 build" >&2
          exit 1

      - name: Verify public mobile round trip
        run: |
          node world-generator/scripts/verify-adventure-0160-browser.mjs \
            --url "$WAFT_0160_PUBLIC_URL" \
            --public \
            --output world-generator/waft-0160-public-browser.json \
            --screenshot /tmp/waft-0160-public.png \
            >> world-generator/waft-0160-browser.log 2>&1

      - name: Record success
        run: |
          node <<'NODE'
          const fs = require('fs');
          const local = require('./world-generator/waft-0160-local-browser.json');
          const published = require('./world-generator/waft-0160-public-browser.json');
          if (!local.valid || !published.valid || !published.public) throw new Error('Browser verification is incomplete');
          if (local.buildId !== 'waft-adventure-0160-visual-access-v1' || published.buildId !== local.buildId) throw new Error('Build mismatch');
          if (local.transitions !== 2 || published.transitions !== 2 || !local.restored || !published.restored) throw new Error('Round trip or restoration failed');
          if (local.access.localEntry.probeDistance <= 10 || published.access.localEntry.probeDistance <= 10) throw new Error('Wide local entry was not proved');
          fs.writeFileSync('world-generator/waft-0160-browser-status.json', JSON.stringify({local:0,public:0,roundTrip:0,restore:0,wideEntry:0,webgl2:0,success:true,verifiedAt:new Date().toISOString()}, null, 2) + '\n');
          NODE

      - name: Commit browser verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/waft-0160-local-browser.json world-generator/waft-0160-public-browser.json world-generator/waft-0160-browser-status.json world-generator/waft-0160-browser.log
          if ! git diff --cached --quiet; then
            git commit -m "Verify WAFT Adventure 0.16.0 on mobile"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: waft-adventure-0160-browser
          path: |
            /tmp/waft-0160-local.png
            /tmp/waft-0160-public.png
          retention-days: 7
