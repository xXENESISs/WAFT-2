name: Verify WAFT Adventure 0.16.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-waft-0160.yml

permissions:
  contents: write

concurrency:
  group: verify-waft-0160
  cancel-in-progress: true

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Wait, verify and persist public mobile build
        shell: bash
        run: |
          set +e
          : > world-generator/waft-0160-public-browser.log
          PAGE_URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/waft-0160.html?v=waft-adventure-0160-visual-access-v1"
          PUBLISHED=1
          for attempt in $(seq 1 90); do
            page="$(curl -fsS --max-time 20 "$PAGE_URL" || true)"
            baleares="$(curl -fsS --max-time 20 "https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-012.html?v=waft-adventure-0160-visual-access-v1" || true)"
            catalunya="$(curl -fsS --max-time 20 "https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-catalunya-litoral-002.html?v=waft-adventure-0160-visual-access-v1" || true)"
            if printf '%s' "$page" | grep -q 'waft-adventure-0160-visual-access-v1' \
              && printf '%s' "$page" | grep -q 'region-runtime-baleares-012.html' \
              && printf '%s' "$page" | grep -q 'region-runtime-catalunya-litoral-002.html' \
              && printf '%s' "$baleares" | grep -q "version: '012'" \
              && printf '%s' "$catalunya" | grep -q "version: '002'"; then
              PUBLISHED=0
              echo "Exact public build found on attempt $attempt" >> world-generator/waft-0160-public-browser.log
              break
            fi
            sleep 4
          done

          PUBLIC=99
          if [ "$PUBLISHED" -eq 0 ]; then
            node world-generator/scripts/verify-adventure-0160-browser.mjs \
              --url "$PAGE_URL" \
              --public \
              --output world-generator/waft-0160-public-browser.json \
              --screenshot /tmp/waft-0160-public.png \
              >> world-generator/waft-0160-public-browser.log 2>&1
            PUBLIC=$?
          else
            echo "Exact public build was not published in time" >> world-generator/waft-0160-public-browser.log
          fi

          node - "$PUBLISHED" "$PUBLIC" <<'NODE'
          const fs = require('fs');
          const published = Number(process.argv[2]);
          const publicBrowser = Number(process.argv[3]);
          const local = fs.existsSync('world-generator/waft-0160-local-browser.json')
            ? JSON.parse(fs.readFileSync('world-generator/waft-0160-local-browser.json','utf8'))
            : null;
          const publicReport = fs.existsSync('world-generator/waft-0160-public-browser.json')
            ? JSON.parse(fs.readFileSync('world-generator/waft-0160-public-browser.json','utf8'))
            : null;
          const success = published===0 && publicBrowser===0 && local?.valid===true && publicReport?.valid===true && publicReport?.public===true && publicReport.buildId===local.buildId && publicReport.transitions===2 && publicReport.restored===true && publicReport.access.localEntry.probeDistance>10;
          fs.writeFileSync('world-generator/waft-0160-browser-status.json', JSON.stringify({syntax:0,local:local?.valid?0:1,published,public:publicBrowser,roundTrip:success?0:99,restore:success?0:99,wideEntry:success?0:99,webgl2:success?0:99,success,verifiedAt:new Date().toISOString()}, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/waft-0160-browser-status.json world-generator/waft-0160-public-browser.log
          [ -f world-generator/waft-0160-public-browser.json ] && git add world-generator/waft-0160-public-browser.json
          if ! git diff --cached --quiet; then
            git commit -m "Record public WAFT Adventure 0.16.0 verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          [ "$PUBLISHED" -eq 0 ] && [ "$PUBLIC" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waft-adventure-0160-public
          path: /tmp/waft-0160-public.png
          if-no-files-found: ignore
          retention-days: 7
