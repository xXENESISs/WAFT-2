name: Validate WAFT region configs

on:
  push:
    paths:
      - .github/workflows/validate-waft-regions.yml
      - world-generator/configs/**
      - world-generator/schema/**
      - world-generator/scripts/**
      - world-generator/overrides/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-waft-regions
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate region contracts
        id: validation
        shell: bash
        run: |
          set +e
          node world-generator/scripts/validate-region.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose regional runtime builder
        id: runtime
        shell: bash
        run: |
          set +e
          : > world-generator/baleares-runtime-diagnostic.log
          node --check world-generator/scripts/build-baleares-runtime.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
          syntax=$?
          node world-generator/scripts/build-baleares-runtime.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
          build=$?
          inline=99
          if [ "$build" -eq 0 ]; then
            python3 - <<'PY' >>world-generator/baleares-runtime-diagnostic.log 2>&1
          from pathlib import Path
          import re
          html = Path('mallorca-mobile/region-runtime-baleares-001.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/region-runtime-inline.mjs').write_text(scripts[0], encoding='utf-8')
          PY
            extracted=$?
            if [ "$extracted" -eq 0 ]; then
              node --check /tmp/region-runtime-inline.mjs >>world-generator/baleares-runtime-diagnostic.log 2>&1
              inline=$?
            else
              inline=$extracted
            fi
          fi
          cat > world-generator/baleares-runtime-diagnostic-status.json <<JSON
          {
            "diagnosticVersion": 2,
            "syntax": $syntax,
            "build": $build,
            "inlineSyntax": $inline
          }
          JSON
          echo "code=$((syntax || build || inline))" >> "$GITHUB_OUTPUT"
          cat world-generator/baleares-runtime-diagnostic-status.json
          exit 0

      - name: Show validation reports
        if: always()
        shell: bash
        run: |
          cat world-generator/validation-report.json
          cat world-generator/baleares-runtime-diagnostic-status.json
          cat world-generator/baleares-runtime-diagnostic.log

      - name: Commit validation and runtime diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/validation-report.json \
            world-generator/baleares-runtime-diagnostic-status.json \
            world-generator/baleares-runtime-diagnostic.log \
            mallorca-mobile/region-runtime-baleares-001.html \
            world-generator/baleares-runtime-build.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Baleares regional runtime builder"
          git push origin HEAD:main

      - name: Require valid configurations
        if: steps.validation.outputs.code != '0'
        run: exit 1

      - name: Require valid runtime builder
        if: steps.runtime.outputs.code != '0'
        run: exit 1
