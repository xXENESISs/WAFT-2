name: Validate WAFT region configs

on:
  push:
    paths:
      - .github/workflows/validate-waft-regions.yml
      - world-generator/configs/**
      - world-generator/schema/**
      - world-generator/scripts/**
      - world-generator/overrides/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate region contracts
        id: validation
        shell: bash
        run: |
          set +e
          node world-generator/scripts/validate-region.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and diagnose runtime 002
        id: runtime002
        shell: bash
        run: |
          set +e
          LOG=world-generator/baleares-runtime-002-diagnostic.log
          : > "$LOG"
          node --check world-generator/scripts/run-build-baleares-runtime-002.mjs >>"$LOG" 2>&1
          runner_syntax=$?
          node world-generator/scripts/run-build-baleares-runtime-002.mjs >>"$LOG" 2>&1
          build=$?
          inline_syntax=99
          if [ "$build" -eq 0 ]; then
            python3 - <<'PY' >>"$LOG" 2>&1
          from pathlib import Path
          import re
          html = Path('mallorca-mobile/region-runtime-baleares-002.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/region-runtime-002-inline.mjs').write_text(scripts[0], encoding='utf-8')
          PY
            extract=$?
            if [ "$extract" -eq 0 ]; then
              node --check /tmp/region-runtime-002-inline.mjs >>"$LOG" 2>&1
              inline_syntax=$?
            else
              inline_syntax=$extract
            fi
          fi
          valid=false
          if [ "$runner_syntax" -eq 0 ] && [ "$build" -eq 0 ] && [ "$inline_syntax" -eq 0 ]; then valid=true; fi
          cat > world-generator/baleares-runtime-002-diagnostic-status.json <<JSON
          {
            "diagnosticVersion": 3,
            "runnerSyntax": $runner_syntax,
            "build": $build,
            "inlineSyntax": $inline_syntax,
            "valid": $valid
          }
          JSON
          cat world-generator/baleares-runtime-002-diagnostic-status.json
          cat "$LOG"
          if [ "$valid" = true ]; then echo "code=0" >> "$GITHUB_OUTPUT"; else echo "code=1" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Show validation report
        if: always()
        run: cat world-generator/validation-report.json

      - name: Commit validation reports and runtime 002
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/validation-report.json \
            world-generator/baleares-runtime-002-diagnostic-status.json \
            world-generator/baleares-runtime-002-diagnostic.log \
            world-generator/baleares-runtime-002-build.json \
            mallorca-mobile/region-runtime-baleares-002.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish syntax-validated Baleares runtime 002"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require valid configurations
        if: steps.validation.outputs.code != '0'
        run: exit 1

      - name: Require valid runtime 002 builder
        if: steps.runtime002.outputs.code != '0'
        run: exit 1
