name: Validate WAFT region configs

on:
  push:
    paths:
      - .github/workflows/validate-waft-regions.yml
      - world-generator/configs/**
      - world-generator/schema/**
      - world-generator/scripts/**
      - world-generator/overrides/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-waft-regions
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate region contracts
        id: validation
        shell: bash
        run: |
          set +e
          node world-generator/scripts/validate-region.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose regional runtime builder
        id: runtime
        shell: bash
        run: |
          set +e
          node world-generator/scripts/diagnose-baleares-runtime.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show validation reports
        if: always()
        shell: bash
        run: |
          cat world-generator/validation-report.json
          cat world-generator/baleares-runtime-diagnostic-status.json
          cat world-generator/baleares-runtime-diagnostic.log

      - name: Commit validation reports
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/validation-report.json \
            world-generator/baleares-runtime-diagnostic-status.json \
            world-generator/baleares-runtime-diagnostic.log \
            mallorca-mobile/region-runtime-baleares-001.html \
            world-generator/baleares-runtime-build.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Baleares regional runtime builder"
          git push origin HEAD:main

      - name: Require valid configurations
        if: steps.validation.outputs.code != '0'
        run: exit 1

      - name: Require valid runtime builder
        if: steps.runtime.outputs.code != '0'
        run: exit 1
