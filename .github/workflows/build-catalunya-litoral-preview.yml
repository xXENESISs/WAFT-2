name: Build Catalunya litoral preview

on:
  push:
    paths:
      - .github/workflows/build-catalunya-litoral-preview.yml
      - world-generator/sources/catalunya-litoral/openstreetmap-extract.json.gz
      - regions/catalunya-litoral/objects.json
      - regions/catalunya-litoral/routes.json
      - world-generator/scripts/import-wikidata-landmarks.py
      - world-generator/scripts/import-wikidata-landmarks-v2.py
      - world-generator/scripts/apply-wikidata-landmarks.mjs
      - world-generator/scripts/apply-wikidata-landmarks-v2.mjs
      - world-generator/scripts/build-region-preview-v2.mjs
      - world-generator/scripts/verify-region-preview-v2.mjs
      - world-generator/scripts/build-region-preview-page.mjs
      - world-generator/scripts/verify-region-preview-browser-v2.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalunya-litoral-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify OSM prerequisite
        run: |
          test -f world-generator/sources/catalunya-litoral/openstreetmap-extract.json.gz
          test -f regions/catalunya-litoral/objects.json
          test -f regions/catalunya-litoral/routes.json
          test "$(node -p "require('./world-generator/catalunya-litoral-osm-status.json').apply")" = 0
      - name: Record protected WAFT files
        run: |
          test "$(git hash-object mallorca-mobile/waft-0155-estable.html)" = "5f156699565fd50ac9ce340d694275ad5c803d70"
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js \
            mallorca-mobile/region-preview-baleares-001.html \
            mallorca-mobile/region-runtime-baleares-011.html \
            regions/baleares/manifest.json \
            > /tmp/catalunya-preview-protected-before.sha256
      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Build and verify preview locally
        id: build
        shell: bash
        run: |
          set +e
          log=world-generator/catalunya-litoral-preview.log
          status=world-generator/catalunya-litoral-preview-status.json
          rm -f world-generator/catalunya-litoral-preview-public-verification.json
          : > "$log"
          wikidata_import=0
          wikidata_apply=0
          preview=0
          verify=0
          page=0
          inline=0
          browser=0
          deterministic=0
          protected=0

          run_logged() {
            echo "== $1 ==" >> "$log"
            shift
            "$@" >> "$log" 2>&1
            code=$?
            echo "exit=${code}" >> "$log"
            return "$code"
          }

          run_logged 'import selected Wikidata landmarks' python world-generator/scripts/import-wikidata-landmarks-v2.py catalunya-litoral --retrieved-on 2026-08-03 || wikidata_import=$?
          if [ "$wikidata_import" = 0 ]; then run_logged 'rank Wikidata landmarks' node world-generator/scripts/apply-wikidata-landmarks-v2.mjs catalunya-litoral || wikidata_apply=$?; else wikidata_apply=99; fi
          if [ "$wikidata_apply" = 0 ]; then run_logged 'build compact preview' node world-generator/scripts/build-region-preview-v2.mjs catalunya-litoral || preview=$?; else preview=99; fi
          if [ "$preview" = 0 ]; then run_logged 'verify compact preview' node world-generator/scripts/verify-region-preview-v2.mjs catalunya-litoral || verify=$?; else verify=99; fi
          if [ "$verify" = 0 ]; then run_logged 'build mobile preview page' node world-generator/scripts/build-region-preview-page.mjs catalunya-litoral 001 || page=$?; else page=99; fi
          if [ "$page" = 0 ]; then
            python - <<'PY' > /tmp/catalunya-preview-inline.mjs
          from pathlib import Path
          import re
          text = Path('mallorca-mobile/region-preview-catalunya-litoral-001.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          forbidden = ('Palma', 'Llevant', 'Alcúdia', 'Menorca', 'Eivissa', '../regions/baleares/', 'baleares-preview-v1')
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit(f'Baleares-specific content remains: {remaining}')
          print(scripts[0])
          PY
            run_logged 'check inline JavaScript' node --check /tmp/catalunya-preview-inline.mjs || inline=$?
          else inline=99; fi
          if [ "$inline" = 0 ]; then
            python -m http.server 8000 --bind 127.0.0.1 >/tmp/catalunya-preview-server.log 2>&1 &
            server_pid=$!
            sleep 2
            run_logged 'verify local mobile preview' node world-generator/scripts/verify-region-preview-browser-v2.mjs --region catalunya-litoral --url http://127.0.0.1:8000/mallorca-mobile/region-preview-catalunya-litoral-001.html?v=local --output world-generator/catalunya-litoral-preview-local-browser.json --screenshot /tmp/catalunya-preview-local.png || browser=$?
            kill "$server_pid" >/dev/null 2>&1 || true
          else browser=99; fi
          if [ "$browser" = 0 ]; then
            sha256sum regions/catalunya-litoral/landmarks.json regions/catalunya-litoral/manifest.json regions/catalunya-litoral/preview/catalunya-litoral-preview-v1.bin regions/catalunya-litoral/preview/catalunya-litoral-preview-v1.json mallorca-mobile/region-preview-catalunya-litoral-001.html > /tmp/catalunya-preview-first.sha
            run_logged 'deterministic Wikidata ranking' node world-generator/scripts/apply-wikidata-landmarks-v2.mjs catalunya-litoral || deterministic=$?
            run_logged 'deterministic preview rebuild' node world-generator/scripts/build-region-preview-v2.mjs catalunya-litoral || deterministic=$?
            run_logged 'deterministic preview verification' node world-generator/scripts/verify-region-preview-v2.mjs catalunya-litoral || deterministic=$?
            run_logged 'deterministic preview page rebuild' node world-generator/scripts/build-region-preview-page.mjs catalunya-litoral 001 || deterministic=$?
            sha256sum regions/catalunya-litoral/landmarks.json regions/catalunya-litoral/manifest.json regions/catalunya-litoral/preview/catalunya-litoral-preview-v1.bin regions/catalunya-litoral/preview/catalunya-litoral-preview-v1.json mallorca-mobile/region-preview-catalunya-litoral-001.html > /tmp/catalunya-preview-second.sha
            diff -u /tmp/catalunya-preview-first.sha /tmp/catalunya-preview-second.sha >> "$log" 2>&1 || deterministic=$?
          else deterministic=99; fi
          test "$(git hash-object mallorca-mobile/waft-0155-estable.html)" = "5f156699565fd50ac9ce340d694275ad5c803d70" || protected=$?
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js \
            mallorca-mobile/region-preview-baleares-001.html \
            mallorca-mobile/region-runtime-baleares-011.html \
            regions/baleares/manifest.json \
            > /tmp/catalunya-preview-protected-after.sha256
          diff -u /tmp/catalunya-preview-protected-before.sha256 /tmp/catalunya-preview-protected-after.sha256 >> "$log" 2>&1 || protected=$?
          printf '{"wikidataImport":%s,"wikidataApply":%s,"preview":%s,"verify":%s,"page":%s,"inline":%s,"browser":%s,"deterministic":%s,"protected":%s}\n' "$wikidata_import" "$wikidata_apply" "$preview" "$verify" "$page" "$inline" "$browser" "$deterministic" "$protected" > "$status"
          cat "$log"
          all=0
          for code in "$wikidata_import" "$wikidata_apply" "$preview" "$verify" "$page" "$inline" "$browser" "$deterministic" "$protected"; do [ "$code" = 0 ] || all=1; done
          echo "code=${all}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit local preview
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          optional=(
            world-generator/sources/catalunya-litoral/wikidata-landmarks.json
            world-generator/sources/catalunya-litoral/wikidata-landmarks.json.gz
            regions/catalunya-litoral
            mallorca-mobile/region-preview-catalunya-litoral-001.html
            world-generator/catalunya-litoral-preview-build.json
            world-generator/catalunya-litoral-preview-validation.json
            world-generator/catalunya-litoral-preview-local-browser.json
            world-generator/catalunya-litoral-preview.log
            world-generator/catalunya-litoral-preview-status.json
          )
          for path in "${optional[@]}"; do [ -e "$path" ] && git add "$path"; done
          git add -A -- world-generator/catalunya-litoral-preview-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Catalunya litoral regional preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          blob="$(git hash-object mallorca-mobile/region-preview-catalunya-litoral-001.html 2>/dev/null || true)"
          echo "PREVIEW_BLOB=${blob}" >> "$GITHUB_ENV"
      - name: Require local success
        if: steps.build.outputs.code != '0'
        run: exit 1
      - name: Wait for exact public preview
        shell: bash
        run: |
          page_url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-preview-catalunya-litoral-001.html?v=${PREVIEW_BLOB}"
          expected_build="$(node -p "require('./world-generator/catalunya-litoral-preview-local-browser.json').buildId")"
          expected_sha="$(node -p "require('./world-generator/catalunya-litoral-preview-local-browser.json').binarySha256")"
          metadata_url="https://xxenesiss.github.io/WAFT-2/regions/catalunya-litoral/preview/catalunya-litoral-preview-v1.json?v=${expected_build}"
          echo "PUBLIC_PREVIEW_URL=${page_url}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 120); do
            metadata="$(curl -fsS --max-time 20 "$metadata_url" || true)"
            actual_build="$(printf '%s' "$metadata" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).buildId||'')}catch{}})")"
            actual_sha="$(printf '%s' "$metadata" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).binary?.sha256||'')}catch{}})")"
            if [ "$actual_build" = "$expected_build" ] && [ "$actual_sha" = "$expected_sha" ]; then exit 0; fi
            sleep 5
          done
          echo "Expected public build ${expected_build}/${expected_sha}" >&2
          exit 1
      - name: Verify public mobile preview
        run: node world-generator/scripts/verify-region-preview-browser-v2.mjs --region catalunya-litoral --url "$PUBLIC_PREVIEW_URL" --public --output world-generator/catalunya-litoral-preview-public-verification.json --screenshot /tmp/catalunya-preview-public.png
      - name: Require exact public build
        run: |
          node - <<'NODE'
          const local = require('./world-generator/catalunya-litoral-preview-local-browser.json');
          const published = require('./world-generator/catalunya-litoral-preview-public-verification.json');
          if (!published.valid || !published.public) throw new Error('Public verification is not valid');
          if (published.buildId !== local.buildId) throw new Error(`Public build mismatch: ${published.buildId}/${local.buildId}`);
          if (published.binarySha256 !== local.binarySha256) throw new Error(`Public binary mismatch: ${published.binarySha256}/${local.binarySha256}`);
          NODE
      - name: Recheck protected stable build
        run: test "$(git hash-object mallorca-mobile/waft-0155-estable.html)" = "5f156699565fd50ac9ce340d694275ad5c803d70"
      - name: Commit public verification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/catalunya-litoral-preview-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify public Catalunya litoral regional preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: catalunya-litoral-preview
          path: |
            /tmp/catalunya-preview-local.png
            /tmp/catalunya-preview-public.png
          retention-days: 7
