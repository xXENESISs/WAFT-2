name: Patch runtime 008 safe entry

on:
  push:
    paths:
      - .github/workflows/patch-runtime-008-safe-entry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add safe local entry transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('world-generator/scripts/build-baleares-runtime-008.mjs')
          source = path.read_text(encoding='utf-8')
          marker = '''assert(html.includes("version: '008'"), 'Runtime 008 API version is missing');'''
          assert marker in source, 'Runtime 008 assertion marker is missing'
          assert 'safe geographic local entry' not in source, 'Safe entry patch already exists'
          insertion = r'''html = replaceOnce(
            html,
            `      state.localCenter.x = localAssets.metadata.center.x;
                state.localCenter.z = localAssets.metadata.center.z;
                state.localZoneId = localAssets.metadata.zoneId;
                state.worldMode = 'local';
                state.worldScale = localAssets.metadata.worldScale;
                state.footprintScale = localAssets.metadata.footprintScale;
                state.localRadius = localAssets.metadata.regionalRadius;
                state.renderDataset = 'local-package';
                state.activeBuildings = localAssets.metadata.counts.buildings;
                state.loadedCells = 1;
                state.cameraDistance = 7.2;
                updateScaleButton();`,
            `      const entryOrigin = { x: state.camera.x, z: state.camera.z, terrainMeters: state.camera.y };
                state.localCenter.x = localAssets.metadata.center.x;
                state.localCenter.z = localAssets.metadata.center.z;
                state.localZoneId = localAssets.metadata.zoneId;
                state.worldMode = 'local';
                state.worldScale = localAssets.metadata.worldScale;
                state.footprintScale = localAssets.metadata.footprintScale;
                state.localRadius = localAssets.metadata.regionalRadius;
                state.renderDataset = 'local-package';
                state.activeBuildings = localAssets.metadata.counts.buildings;
                state.loadedCells = 1;
                const safeEntry = findSafeSpawn({ id: preset.id, x: entryOrigin.x, z: entryOrigin.z, terrainMeters: entryOrigin.terrainMeters });
                state.camera.x = safeEntry.x;
                state.camera.z = safeEntry.z;
                state.camera.y = safeEntry.terrain + 1.35;
                state.velocityY = 0;
                state.grounded = true;
                state.cameraDistance = 7.2;
                updateScaleButton();`,
            'safe geographic local entry'
          );

          assert(html.includes('const safeEntry = findSafeSpawn'), 'Runtime 008 does not select a safe local entry parcel');

          '''
          source = source.replace(marker, insertion + marker, 1)
          source = source.replace(
              '    previousZoneReleasesBeforeNextLoad: true\n',
              '    previousZoneReleasesBeforeNextLoad: true,\n    entryUsesSafeLocalParcel: true\n',
              1
          )
          source = source.replace('const BUILD_REVISION = 1;', 'const BUILD_REVISION = 2;', 1)
          path.write_text(source, encoding='utf-8')
          PY
          node --check world-generator/scripts/build-baleares-runtime-008.mjs
      - name: Commit safe-entry builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/scripts/build-baleares-runtime-008.mjs
          git commit -m "Use safe parcels for geographic zone entry"
          git pull --rebase origin main
          git push origin HEAD:main
