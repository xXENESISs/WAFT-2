name: Patch WAFT 0.15.9 restored state v2

on:
  push:
    paths:
      - .github/workflows/patch-waft-0159-restore-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expose restored state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('world-generator/scripts/build-adventure-0159.mjs')
          text = path.read_text(encoding='utf-8')
          needle = "      transitionCount: state.transitionCount,\n      lastSavedAt: state.lastSavedAt,"
          replacement = "      transitionCount: state.transitionCount,\n      restored: state.restored,\n      lastSavedAt: state.lastSavedAt,"
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one snapshot target, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/scripts/build-adventure-0159.mjs
          git commit -m "Expose restored world state in Adventure snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
