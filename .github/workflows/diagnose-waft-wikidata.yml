name: Diagnose WAFT Wikidata

on:
  push:
    paths:
      - .github/workflows/diagnose-waft-wikidata.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DIAGNOSTIC_VERSION: '1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Wikidata diagnostic
        shell: bash
        run: |
          set +e
          LOG=world-generator/baleares-wikidata-diagnostic.log
          : > "$LOG"
          python -m py_compile world-generator/scripts/import-wikidata-landmarks.py >>"$LOG" 2>&1
          S0=$?
          node --check world-generator/scripts/apply-wikidata-landmarks.mjs >>"$LOG" 2>&1
          S1=$?
          node --check world-generator/scripts/verify-wikidata-landmarks.mjs >>"$LOG" 2>&1
          S2=$?
          python world-generator/scripts/import-wikidata-landmarks.py baleares --retrieved-on "$(date -u +%F)" >>"$LOG" 2>&1
          S3=$?
          node world-generator/scripts/build-region.mjs baleares >>"$LOG" 2>&1
          S4=$?
          node world-generator/scripts/apply-copernicus-dem.mjs baleares >>"$LOG" 2>&1
          S5=$?
          node world-generator/scripts/apply-esa-worldcover.mjs baleares >>"$LOG" 2>&1
          S6=$?
          node world-generator/scripts/apply-openstreetmap.mjs baleares >>"$LOG" 2>&1
          S7=$?
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares >>"$LOG" 2>&1
          S8=$?
          node world-generator/scripts/verify-wikidata-landmarks.mjs baleares >>"$LOG" 2>&1
          S9=$?
          rm -rf /tmp/waft-wiki-a /tmp/waft-wiki-b
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-wiki-a >>"$LOG" 2>&1
          node world-generator/scripts/apply-copernicus-dem.mjs baleares --output-dir /tmp/waft-wiki-a >>"$LOG" 2>&1
          node world-generator/scripts/apply-esa-worldcover.mjs baleares --output-dir /tmp/waft-wiki-a >>"$LOG" 2>&1
          node world-generator/scripts/apply-openstreetmap.mjs baleares --output-dir /tmp/waft-wiki-a >>"$LOG" 2>&1
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares --output-dir /tmp/waft-wiki-a >>"$LOG" 2>&1
          A=$?
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-wiki-b >>"$LOG" 2>&1
          node world-generator/scripts/apply-copernicus-dem.mjs baleares --output-dir /tmp/waft-wiki-b >>"$LOG" 2>&1
          node world-generator/scripts/apply-esa-worldcover.mjs baleares --output-dir /tmp/waft-wiki-b >>"$LOG" 2>&1
          node world-generator/scripts/apply-openstreetmap.mjs baleares --output-dir /tmp/waft-wiki-b >>"$LOG" 2>&1
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares --output-dir /tmp/waft-wiki-b >>"$LOG" 2>&1
          B=$?
          diff -qr /tmp/waft-wiki-a /tmp/waft-wiki-b >>"$LOG" 2>&1
          S10=$?
          cat > world-generator/baleares-wikidata-diagnostic-status.json <<EOF
          {
            "diagnosticVersion": ${DIAGNOSTIC_VERSION},
            "pythonSyntax": $S0,
            "applySyntax": $S1,
            "verifySyntax": $S2,
            "import": $S3,
            "baseBuild": $S4,
            "dem": $S5,
            "worldcover": $S6,
            "openstreetmap": $S7,
            "wikidataApply": $S8,
            "wikidataVerify": $S9,
            "rebuildA": $A,
            "rebuildB": $B,
            "deterministic": $S10
          }
          EOF
          cat "$LOG"

      - name: Commit diagnostic and generated results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/baleares-wikidata-diagnostic.log \
            world-generator/baleares-wikidata-diagnostic-status.json \
            world-generator/sources/baleares \
            world-generator/baleares-wikidata-validation.json \
            regions/baleares || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Wikidata diagnostic"
          git push origin HEAD:main
