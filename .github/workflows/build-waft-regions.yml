name: Build WAFT region packages

on:
  push:
    paths:
      - .github/workflows/build-waft-regions.yml
      - world-generator/**
      - mallorca-mobile/waft-0158.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-waft-regions
  cancel-in-progress: true

jobs:
  build-baleares:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record frozen 0.15.5 files
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Copernicus source tiles
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/copernicus-dem
          key: copernicus-dem-glo30-baleares-v1

      - name: Cache ESA WorldCover source tiles
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/esa-worldcover
          key: esa-worldcover-2021-v200-baleares-v1

      - name: Cache OpenStreetMap regional extract
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/openstreetmap
          key: openstreetmap-geofabrik-baleares-v1

      - name: Check generator syntax
        shell: bash
        run: |
          python -m py_compile world-generator/scripts/import-copernicus-dem.py
          python -m py_compile world-generator/scripts/import-esa-worldcover.py
          python -m py_compile world-generator/scripts/import-openstreetmap.py
          python -m py_compile world-generator/scripts/import-wikidata-landmarks.py
          node --check world-generator/lib/projection.mjs
          node --check world-generator/lib/legacy-baleares-source.mjs
          node --check world-generator/lib/binary-formats.mjs
          node --check world-generator/scripts/build-region.mjs
          node --check world-generator/scripts/apply-copernicus-dem.mjs
          node --check world-generator/scripts/apply-esa-worldcover.mjs
          node --check world-generator/scripts/apply-openstreetmap.mjs
          node --check world-generator/scripts/apply-wikidata-landmarks.mjs
          node --check world-generator/scripts/verify-region-package.mjs
          node --check world-generator/scripts/verify-copernicus-dem.mjs
          node --check world-generator/scripts/verify-esa-worldcover.mjs
          node --check world-generator/scripts/verify-openstreetmap.mjs
          node --check world-generator/scripts/verify-wikidata-landmarks.mjs
          node --check world-generator/scripts/validate-region.mjs

      - name: Validate region contracts
        run: node world-generator/scripts/validate-region.mjs

      - name: Install geospatial import dependencies when required
        shell: bash
        run: |
          if [ ! -f world-generator/sources/baleares/copernicus-dem-glo30.bin ] || \
             [ ! -f world-generator/sources/baleares/esa-worldcover-2021-v200.bin ]; then
            python -m pip install --disable-pip-version-check numpy rasterio
          fi
          if [ ! -f world-generator/sources/baleares/openstreetmap-extract.json.gz ]; then
            python -m pip install --disable-pip-version-check osmium
          fi

      - name: Prepare real Copernicus elevation snapshot
        shell: bash
        run: |
          python world-generator/scripts/import-copernicus-dem.py baleares \
            --retrieved-on "$(date -u +%F)" | tee world-generator/baleares-dem-import.log

      - name: Prepare real ESA WorldCover snapshot
        shell: bash
        run: |
          python world-generator/scripts/import-esa-worldcover.py baleares \
            --retrieved-on "$(date -u +%F)" | tee world-generator/baleares-worldcover-import.log

      - name: Prepare OpenStreetMap regional snapshot
        shell: bash
        run: |
          python world-generator/scripts/import-openstreetmap.py baleares \
            --retrieved-on "$(date -u +%F)" | tee world-generator/baleares-openstreetmap-import.log

      - name: Prepare Wikidata landmark snapshot
        shell: bash
        run: |
          python world-generator/scripts/import-wikidata-landmarks.py baleares \
            --retrieved-on "$(date -u +%F)" | tee world-generator/baleares-wikidata-import.log

      - name: Build Baleares physical package
        shell: bash
        run: |
          node world-generator/scripts/build-region.mjs baleares | tee world-generator/baleares-build.log
          node world-generator/scripts/apply-copernicus-dem.mjs baleares | tee world-generator/baleares-dem-apply.log
          node world-generator/scripts/apply-esa-worldcover.mjs baleares | tee world-generator/baleares-worldcover-apply.log
          node world-generator/scripts/apply-openstreetmap.mjs baleares | tee world-generator/baleares-openstreetmap-apply.log

      - name: Verify physical cartography
        shell: bash
        run: |
          node world-generator/scripts/verify-region-package.mjs baleares
          node world-generator/scripts/verify-copernicus-dem.mjs baleares
          node world-generator/scripts/verify-esa-worldcover.mjs baleares
          node world-generator/scripts/verify-openstreetmap.mjs baleares

      - name: Rank and classify landmarks
        shell: bash
        run: |
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares | tee world-generator/baleares-wikidata-apply.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" regions/baleares/manifest.json

      - name: Verify Wikidata landmark ranking
        run: node world-generator/scripts/verify-wikidata-landmarks.mjs baleares

      - name: Verify deterministic rebuild
        shell: bash
        run: |
          rm -rf /tmp/waft-region-a /tmp/waft-region-b
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-region-a >/tmp/waft-region-a.log
          node world-generator/scripts/apply-copernicus-dem.mjs baleares --output-dir /tmp/waft-region-a >>/tmp/waft-region-a.log
          node world-generator/scripts/apply-esa-worldcover.mjs baleares --output-dir /tmp/waft-region-a >>/tmp/waft-region-a.log
          node world-generator/scripts/apply-openstreetmap.mjs baleares --output-dir /tmp/waft-region-a >>/tmp/waft-region-a.log
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares --output-dir /tmp/waft-region-a >>/tmp/waft-region-a.log
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-region-b >/tmp/waft-region-b.log
          node world-generator/scripts/apply-copernicus-dem.mjs baleares --output-dir /tmp/waft-region-b >>/tmp/waft-region-b.log
          node world-generator/scripts/apply-esa-worldcover.mjs baleares --output-dir /tmp/waft-region-b >>/tmp/waft-region-b.log
          node world-generator/scripts/apply-openstreetmap.mjs baleares --output-dir /tmp/waft-region-b >>/tmp/waft-region-b.log
          node world-generator/scripts/apply-wikidata-landmarks.mjs baleares --output-dir /tmp/waft-region-b >>/tmp/waft-region-b.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/waft-region-a/manifest.json /tmp/waft-region-b/manifest.json
          diff -qr /tmp/waft-region-a /tmp/waft-region-b
          diff -q regions/baleares/terrain.bin /tmp/waft-region-a/terrain.bin
          diff -q regions/baleares/landcover.bin /tmp/waft-region-a/landcover.bin
          diff -q regions/baleares/sectors.json /tmp/waft-region-a/sectors.json
          diff -q regions/baleares/settlements.json /tmp/waft-region-a/settlements.json
          diff -q regions/baleares/objects.json /tmp/waft-region-a/objects.json
          diff -q regions/baleares/landmarks.json /tmp/waft-region-a/landmarks.json
          diff -q regions/baleares/fauna.json /tmp/waft-region-a/fauna.json
          diff -q regions/baleares/routes.json /tmp/waft-region-a/routes.json
          diff -q regions/baleares/manifest.json /tmp/waft-region-a/manifest.json

      - name: Confirm frozen build is untouched
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-after.sha256
          diff -u /tmp/waft-0155-before.sha256 /tmp/waft-0155-after.sha256
          git diff --exit-code -- \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js

      - name: Commit generated package, source snapshots and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            regions/baleares \
            world-generator/sources/baleares \
            world-generator/validation-report.json \
            world-generator/baleares-package-validation.json \
            world-generator/baleares-copernicus-dem-validation.json \
            world-generator/baleares-worldcover-validation.json \
            world-generator/baleares-openstreetmap-validation.json \
            world-generator/baleares-wikidata-validation.json \
            world-generator/baleares-build.log \
            world-generator/baleares-dem-import.log \
            world-generator/baleares-dem-apply.log \
            world-generator/baleares-worldcover-import.log \
            world-generator/baleares-worldcover-apply.log \
            world-generator/baleares-openstreetmap-import.log \
            world-generator/baleares-openstreetmap-apply.log \
            world-generator/baleares-wikidata-import.log \
            world-generator/baleares-wikidata-apply.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Baleares with Wikidata-ranked landmarks"
          git push origin HEAD:main
