name: Build WAFT region packages

on:
  push:
    paths:
      - .github/workflows/build-waft-regions.yml
      - world-generator/**
      - mallorca-mobile/waft-0158.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-waft-regions
  cancel-in-progress: true

jobs:
  build-baleares:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record frozen 0.15.5 files
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-before.sha256

      - name: Check generator syntax
        shell: bash
        run: |
          node --check world-generator/lib/projection.mjs
          node --check world-generator/lib/legacy-baleares-source.mjs
          node --check world-generator/lib/binary-formats.mjs
          node --check world-generator/scripts/build-region.mjs
          node --check world-generator/scripts/verify-region-package.mjs
          node --check world-generator/scripts/validate-region.mjs

      - name: Validate region contracts
        run: node world-generator/scripts/validate-region.mjs

      - name: Build Baleares package
        shell: bash
        run: |
          node world-generator/scripts/build-region.mjs baleares | tee world-generator/baleares-build.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" regions/baleares/manifest.json

      - name: Verify Baleares package
        run: node world-generator/scripts/verify-region-package.mjs baleares

      - name: Verify deterministic rebuild
        shell: bash
        run: |
          rm -rf /tmp/waft-region-a /tmp/waft-region-b
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-region-a >/tmp/waft-region-a.log
          node world-generator/scripts/build-region.mjs baleares --output-dir /tmp/waft-region-b >/tmp/waft-region-b.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/waft-region-a/manifest.json /tmp/waft-region-b/manifest.json
          diff -qr /tmp/waft-region-a /tmp/waft-region-b
          diff -q regions/baleares/terrain.bin /tmp/waft-region-a/terrain.bin
          diff -q regions/baleares/landcover.bin /tmp/waft-region-a/landcover.bin
          diff -q regions/baleares/sectors.json /tmp/waft-region-a/sectors.json

      - name: Confirm frozen build is untouched
        shell: bash
        run: |
          sha256sum \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js > /tmp/waft-0155-after.sha256
          diff -u /tmp/waft-0155-before.sha256 /tmp/waft-0155-after.sha256
          git diff --exit-code -- \
            mallorca-mobile/waft-0155-estable.html \
            mallorca-mobile/v155direct2-00.js \
            mallorca-mobile/v155direct2-01.js \
            mallorca-mobile/v155direct2-02.js \
            mallorca-mobile/v155direct2-03.js \
            mallorca-mobile/v155direct2-04.js \
            mallorca-mobile/v155direct2-05.js \
            mallorca-mobile/v155direct2-06.js

      - name: Commit generated package and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            regions/baleares \
            world-generator/validation-report.json \
            world-generator/baleares-package-validation.json \
            world-generator/baleares-build.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Baleares region package"
          git push origin HEAD:main
