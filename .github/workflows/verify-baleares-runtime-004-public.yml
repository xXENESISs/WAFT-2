name: Verify public Baleares runtime 004
# direct verification revision 2

on:
  push:
    paths:
      - .github/workflows/verify-baleares-runtime-004-public.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-public-baleares-runtime-004
  cancel-in-progress: true

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser verifier
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Verify exact public runtime
        shell: bash
        run: |
          URL="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-004.html?v=ff212aa47b156baa8412d7a68636b9fb58a9290566e1726e604af12f44bce1c5"
          set +e
          node world-generator/scripts/verify-baleares-runtime-004-browser.mjs \
            --url "$URL" \
            --public \
            --output world-generator/baleares-runtime-004-public-verification.json \
            --screenshot /tmp/baleares-runtime-004-public-direct.png
          CODE=$?
          set -e
          VALID=false
          if [ "$CODE" -eq 0 ]; then VALID=true; fi
          cat > world-generator/baleares-runtime-004-public-status.json <<JSON
          {
            "verificationVersion": 1,
            "url": "$URL",
            "exitCode": $CODE,
            "valid": $VALID
          }
          JSON
          exit "$CODE"

      - name: Commit public verification
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/baleares-runtime-004-public-verification.json \
            world-generator/baleares-runtime-004-public-status.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify public Baleares regional runtime 004 directly"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baleares-runtime-004-public-direct
          path: /tmp/baleares-runtime-004-public-direct.png
          if-no-files-found: ignore
          retention-days: 7
