name: Verify public Baleares runtime 006

on:
  push:
    paths:
      - .github/workflows/verify-public-baleares-runtime-006.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Wait for public runtime 006
        shell: bash
        run: |
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-006.html?v=ffd1e22a2cce491cdec2fc7abe542f86baeeb39d"
          echo "PUBLIC_URL=${url}" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 20 "$url" | grep -q "RUNTIME REGIONAL 006"; then
              echo "Public runtime 006 is current"
              exit 0
            fi
            echo "Waiting for GitHub Pages (${attempt}/60)"
            sleep 5
          done
          exit 1

      - name: Verify public mobile runtime
        id: verify
        shell: bash
        run: |
          set +e
          node world-generator/scripts/verify-baleares-runtime-006-browser.mjs \
            --url "$PUBLIC_URL" \
            --public \
            --output world-generator/baleares-runtime-006-public-verification.json \
            --screenshot /tmp/runtime-006-public.png \
            > world-generator/baleares-runtime-006-public-diagnostic.log 2>&1
          code=$?
          printf '{"exitCode":%s,"url":"%s"}\n' "$code" "$PUBLIC_URL" > world-generator/baleares-runtime-006-public-status.json
          cat world-generator/baleares-runtime-006-public-diagnostic.log
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit public verification
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            world-generator/baleares-runtime-006-public-diagnostic.log \
            world-generator/baleares-runtime-006-public-status.json
          [ -f world-generator/baleares-runtime-006-public-verification.json ] && git add world-generator/baleares-runtime-006-public-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verify public Baleares regional runtime 006"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require public success
        if: steps.verify.outputs.code != '0'
        run: exit 1
