name: Verify direct public Baleares runtime 010

on:
  push:
    paths:
      - .github/workflows/verify-direct-public-baleares-runtime-010.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Verify public runtime directly
        shell: bash
        run: |
          set +e
          url="https://xxenesiss.github.io/WAFT-2/mallorca-mobile/region-runtime-baleares-010.html?v=1bb026fd0a015246c09868d746d3bc32cee2877c"
          node world-generator/scripts/verify-baleares-runtime-010-browser.mjs \
            --url "$url" \
            --public \
            --output world-generator/baleares-runtime-010-public-verification.json \
            --screenshot /tmp/runtime-010-public.png \
            > world-generator/baleares-runtime-010-direct-public.log 2>&1
          code=$?
          printf '{"exitCode":%s,"url":"%s"}\n' "$code" "$url" > world-generator/baleares-runtime-010-direct-public-status.json
          cat world-generator/baleares-runtime-010-direct-public.log
          exit 0
      - name: Commit public result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/baleares-runtime-010-direct-public.log world-generator/baleares-runtime-010-direct-public-status.json
          [ -f world-generator/baleares-runtime-010-public-verification.json ] && git add world-generator/baleares-runtime-010-public-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify direct public Baleares runtime 010"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require success
        run: test "$(jq -r .exitCode world-generator/baleares-runtime-010-direct-public-status.json)" = "0"
