name: Patch WAFT 0.15.9 restored state

on:
  push:
    paths:
      - .github/workflows/patch-waft-0159-restore.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expose restored state in world snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('world-generator/scripts/build-adventure-0159.mjs')
          text = path.read_text(encoding='utf-8')
          old = """      transitionCount: state.transitionCount,
              lastSavedAt: state.lastSavedAt,
          """
          new = """      transitionCount: state.transitionCount,
              restored: state.restored,
              lastSavedAt: state.lastSavedAt,
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one snapshot target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit restored-state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/scripts/build-adventure-0159.mjs
          git commit -m "Expose restored world state in Adventure snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
