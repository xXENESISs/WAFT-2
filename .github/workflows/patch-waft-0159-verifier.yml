name: Patch WAFT 0.15.9 verifier

on:
  push:
    paths:
      - .github/workflows/patch-waft-0159-verifier.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pass exit probe into browser context
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('world-generator/scripts/verify-adventure-0159-browser.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  return page.evaluate(() => ({
            probe,
            state: window.WAFTAdventure0159.getState(),
            buttonVisible: document.getElementById('travelButton').classList.contains('visible')
          }));
          """
          new = """  return page.evaluate(currentProbe => ({
            probe: currentProbe,
            state: window.WAFTAdventure0159.getState(),
            buttonVisible: document.getElementById('travelButton').classList.contains('visible')
          }), probe);
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit verifier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/scripts/verify-adventure-0159-browser.mjs
          git commit -m "Pass regional exit probe into Playwright context"
          git pull --rebase origin main
          git push origin HEAD:main
