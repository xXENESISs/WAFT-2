name: Build Iberia explorer 0.24.3

on:
  push:
    branches:
      - agent/iberia-terrain-0240
      - agent/iberia-runtime-0241
      - agent/iberia-explorer-0242
      - agent/iberia-polish-0243
    paths:
      - .github/workflows/build-iberia-terrain-0240.yml
      - world-generator/configs/iberia.region.json
      - world-generator/overrides/iberia.overrides.json
      - world-generator/scripts/import-copernicus-dem-glo90.py
      - world-generator/scripts/build-terrain-only-landcover.py
      - world-generator/scripts/build-spain-settlement-markers-0242.py
      - world-generator/scripts/count-spain-settlement-candidates-0243.py
      - world-generator/scripts/prepare-iberia-0240.mjs
      - world-generator/scripts/prepare-iberia-0242.mjs
      - world-generator/scripts/prepare-iberia-0243.mjs
      - world-generator/scripts/smoke-iberia-terrain-0240.mjs
      - mallorca-mobile/adventure-0210/iberia-explorer-0242.js
      - mallorca-mobile/adventure-0210/iberia-polish-0243.js
      - mallorca-mobile/adventure-0210/tools/smoke-iberia-adventure-0240.mjs
      - mallorca-mobile/adventure-0210/tools/verify-iberia-browser-0241.mjs
  workflow_dispatch:

permissions:
  contents: write

# One generator owns the branch at a time so generated terrain never races an older SHA.
concurrency:
  group: iberia-terrain-0240-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Copernicus GLO-90 tiles
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/copernicus-dem-glo90
          key: waft-iberia-glo90-2021-v1
          save-always: true

      - name: Cache GeoNames city dumps
        uses: actions/cache@v4
        with:
          path: world-generator/.cache/geonames
          key: waft-geonames-cities5000-2026-08-09-v1
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy rasterio
          npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Syntax and region contract
        run: |
          python -m py_compile world-generator/scripts/import-copernicus-dem-glo90.py
          python -m py_compile world-generator/scripts/build-terrain-only-landcover.py
          python -m py_compile world-generator/scripts/build-spain-settlement-markers-0242.py
          python -m py_compile world-generator/scripts/count-spain-settlement-candidates-0243.py
          node --check world-generator/scripts/prepare-iberia-0240.mjs
          node --check world-generator/scripts/prepare-iberia-0242.mjs
          node --check world-generator/scripts/prepare-iberia-0243.mjs
          node --check mallorca-mobile/adventure-0210/iberia-explorer-0242.js
          node --check mallorca-mobile/adventure-0210/iberia-polish-0243.js
          node --check world-generator/scripts/smoke-iberia-terrain-0240.mjs
          node --check mallorca-mobile/adventure-0210/tools/smoke-iberia-adventure-0240.mjs
          node --check mallorca-mobile/adventure-0210/tools/verify-iberia-browser-0241.mjs
          node world-generator/scripts/validate-region.mjs
          node world-generator/scripts/smoke-iberia-terrain-0240.mjs

      - name: Measure 10k settlement option
        run: python world-generator/scripts/count-spain-settlement-candidates-0243.py

      - name: Prepare scale-aware runtime
        run: |
          node world-generator/scripts/prepare-iberia-0240.mjs
          node world-generator/scripts/prepare-iberia-0242.mjs
          node world-generator/scripts/prepare-iberia-0243.mjs

      - name: Import Copernicus GLO-90
        run: python world-generator/scripts/import-copernicus-dem-glo90.py iberia --retrieved-on 2026-08-09

      - name: Derive terrain-only land and water
        run: python world-generator/scripts/build-terrain-only-landcover.py iberia

      - name: Build regional terrain package
        run: node world-generator/scripts/build-region-v2.mjs iberia

      - name: Add Spain 20k settlement markers
        run: python world-generator/scripts/build-spain-settlement-markers-0242.py

      - name: Build mobile preview package
        run: node world-generator/scripts/build-region-preview-v2.mjs iberia

      - name: Verify Iberia 0.24.3 package
        run: |
          node --check mallorca-mobile/adventure-0210/plugin-loader.js
          node --check mallorca-mobile/adventure-0210/iberia-explorer-0242.js
          node --check mallorca-mobile/adventure-0210/iberia-polish-0243.js
          node world-generator/scripts/smoke-iberia-terrain-0240.mjs
          node mallorca-mobile/adventure-0210/tools/smoke-iberia-adventure-0240.mjs

      - name: Persist generated Iberia package before browser verification
        id: persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mallorca-mobile/adventure-0210/index.html \
            mallorca-mobile/adventure-0210/plugin-loader.js \
            world-generator/scripts/build-region-preview.mjs \
            world-generator/scripts/build-region-preview-v2.mjs \
            world-generator/sources/iberia \
            regions/iberia \
            world-generator/iberia-preview-build.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Iberia 0.24.3 data is already deterministic and current."
            exit 0
          fi
          git commit -m "Build Iberian Peninsula explorer runtime 0.24.3"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify Iberia Adventure in Chromium
        if: steps.persist.outputs.changed != 'true'
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/waft-iberia-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node mallorca-mobile/adventure-0210/tools/verify-iberia-browser-0241.mjs \
            "http://127.0.0.1:8000/mallorca-mobile/adventure-0210/index.html?region=iberia&v=ci-${GITHUB_SHA}" \
            /tmp/waft-iberia-0243.png

      - name: Upload Iberia browser screenshot
        if: always() && steps.persist.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iberia-adventure-0243-browser
          path: /tmp/waft-iberia-0243.png
          retention-days: 7
          if-no-files-found: ignore
