name: Repair WAFT Showcase Artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mallorca-mobile/assets/visual/waft-showcase-0182.part0.b64
      - .github/workflows/repair-waft-showcase-art.yml

permissions:
  contents: write

concurrency:
  group: repair-waft-showcase-art
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and inspect approved artwork
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='mallorca-mobile/assets/visual/waft-showcase-0182.part0.b64'
          TARGET='/tmp/waft-showcase-decoded.webp'
          base64 -d "$SOURCE" > "$TARGET"
          echo "DECODED_BYTES=$(wc -c < "$TARGET")"
          echo "DECODED_HASH=$(git hash-object "$TARGET")"
          file "$TARGET"
          cp "$TARGET" /tmp/waft-showcase-decoded-copy.webp
      - uses: actions/upload-artifact@v4
        with:
          name: waft-showcase-decoded-diagnostic
          path: /tmp/waft-showcase-decoded-copy.webp
          retention-days: 1
