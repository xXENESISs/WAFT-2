name: Repair WAFT Showcase Artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mallorca-mobile/assets/visual/waft-showcase-0182.part0.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part01.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part02.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part03.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part04.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part05.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part06a.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part06b.b64
      - mallorca-mobile/assets/visual/waft-showcase-0182.part07.b64
      - .github/workflows/repair-waft-showcase-art.yml

permissions:
  contents: write

concurrency:
  group: repair-waft-showcase-art
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild and verify approved artwork
        shell: bash
        run: |
          set -euo pipefail
          TARGET='mallorca-mobile/assets/visual/waft-visual-showcase-mediterranean-v1.webp'
          cat \
            mallorca-mobile/assets/visual/waft-showcase-0182.part0.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part01.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part02.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part03.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part04.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part05.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part06a.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part06b.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part07.b64 \
            | base64 -d > "$TARGET"
          test "$(wc -c < "$TARGET")" -eq 34592
          test "$(git hash-object "$TARGET")" = 'a4e48b427155220ae22a4674a46a3d5f2238b1c8'
          file "$TARGET" | grep -q '500x354'
      - name: Commit repaired artwork
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mallorca-mobile/assets/visual/waft-visual-showcase-mediterranean-v1.webp
          git rm \
            mallorca-mobile/assets/visual/waft-showcase-0182.part0.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part01.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part02.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part03.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part04.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part05.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part06a.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part06b.b64 \
            mallorca-mobile/assets/visual/waft-showcase-0182.part07.b64
          if ! git diff --cached --quiet; then
            git commit -m 'Repair approved WAFT showcase artwork'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
