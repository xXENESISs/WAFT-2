name: Diagnose Baleares local zones

# Diagnostic revision 3.
on:
  push:
    paths:
      - .github/workflows/diagnose-baleares-local-zones.yml
      - world-generator/configs/baleares-local-zones.json
      - world-generator/scripts/build-local-zone.mjs
      - world-generator/scripts/verify-local-zone.mjs
      - world-generator/scripts/build-local-zone-registry.mjs
      - world-generator/scripts/verify-local-zone-registry.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run complete diagnostic
        shell: bash
        run: |
          set +e
          log=world-generator/baleares-local-zones-diagnostic.log
          status=world-generator/baleares-local-zones-diagnostic-status.json
          : > "$log"

          run_logged() {
            label="$1"
            shift
            echo "== ${label} ==" >> "$log"
            "$@" >> "$log" 2>&1
            code=$?
            echo "exit=${code}" >> "$log"
            return "$code"
          }

          syntax=0
          run_logged 'syntax build' node --check world-generator/scripts/build-local-zone.mjs || syntax=$?
          run_logged 'syntax verify' node --check world-generator/scripts/verify-local-zone.mjs || syntax=$?
          run_logged 'syntax registry build' node --check world-generator/scripts/build-local-zone-registry.mjs || syntax=$?
          run_logged 'syntax registry verify' node --check world-generator/scripts/verify-local-zone-registry.mjs || syntax=$?

          build_llevant=0
          verify_llevant=0
          build_palma=0
          verify_palma=0
          build_registry=0
          verify_registry=0
          run_logged 'build Llevant' node world-generator/scripts/build-local-zone.mjs baleares llevant || build_llevant=$?
          run_logged 'verify Llevant' node world-generator/scripts/verify-local-zone.mjs baleares llevant || verify_llevant=$?
          run_logged 'build Palma' node world-generator/scripts/build-local-zone.mjs baleares palma || build_palma=$?
          run_logged 'verify Palma' node world-generator/scripts/verify-local-zone.mjs baleares palma || verify_palma=$?
          run_logged 'build registry' node world-generator/scripts/build-local-zone-registry.mjs baleares || build_registry=$?
          run_logged 'verify registry' node world-generator/scripts/verify-local-zone-registry.mjs baleares || verify_registry=$?

          cat "$log"
          printf '{"syntax":%s,"buildLlevant":%s,"verifyLlevant":%s,"buildPalma":%s,"verifyPalma":%s,"buildRegistry":%s,"verifyRegistry":%s}\n' \
            "$syntax" "$build_llevant" "$verify_llevant" "$build_palma" "$verify_palma" "$build_registry" "$verify_registry" > "$status"
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-generator/baleares-local-zones-diagnostic.log world-generator/baleares-local-zones-diagnostic-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Baleares local-zone diagnostic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
